<!doctype html><html lang="fr"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Space+Mono:wght@700&display=swap">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  .scene{position:relative;height:100%;display:flex;flex-direction:column;
         justify-content:center;padding:64px 96px;box-sizing:border-box}
  .eyebrow{font-family:Lato,sans-serif;font-size:15px;font-weight:300;
           letter-spacing:.34em;text-transform:uppercase;color:#fff;
           opacity:0;transition:opacity 1.4s ease .1s}
  .on .eyebrow{opacity:.5}
  .phrase{font-family:Lato,'Avenir Next',Avenir,system-ui,sans-serif;
          font-weight:300;color:#b9c0cc;font-size:46px;line-height:1.42;
          letter-spacing:.01em;margin:26px 0 0;max-width:1000px;
          perspective:900px}
  /* les mots qui portent : même graisse, mais ils émettent de la lumière */
  .phrase .fort{color:#fff;text-shadow:0 0 16px rgba(255,255,255,.85),
                0 0 44px rgba(255,255,255,.35),0 0 92px rgba(91,120,255,.45)}
  .m{display:inline-block;margin-right:.35em;opacity:0;
     transition-timing-function:cubic-bezier(.25,.46,.45,.94);
     transition-property:opacity,filter,transform,text-shadow;
     will-change:filter,transform,opacity;transform-style:preserve-3d;
     backface-visibility:hidden}
  .pied{position:absolute;left:96px;right:96px;bottom:52px;display:flex;
        justify-content:space-between;align-items:baseline;gap:40px;
        font-family:Lato,sans-serif;font-weight:300;font-size:20px;
        letter-spacing:.01em;color:#b9c0cc;
        opacity:0;transition:opacity 1.8s ease 2.2s}
  .on .pied{opacity:.5}
</style></head><body>

</div>
<script>

const p = document.getElementById('p'), s = document.getElementById('s');
MOTS.forEach(w => {
  const e = document.createElement('span');
  e.className = 'm' + (w.p === 'fort' ? ' fort' : '');
  e.textContent = w.t;
  e.style.transitionDuration = w.d + 's';
  e.style.transitionDelay = w.r + 's';
  p.appendChild(e);
});
const spans = [...p.children];
function repos() {
  s.classList.remove('on');
  spans.forEach((e, i) => {
    const w = MOTS[i];
    e.style.opacity = 0;
    e.style.filter = 'blur(' + w.b + 'px) brightness(.6)';
    e.style.transform = 'translateY(20px) scale(' + w.s + ') rotateX(-15deg)';
    e.style.textShadow = '0 0 40px rgba(255,255,255,.4)';
  });
}
function jouer() {
  repos();
  requestAnimationFrame(() => setTimeout(() => {
    s.classList.add('on');
    spans.forEach(e => {
      e.style.opacity = 1;
      e.style.filter = 'blur(0px) brightness(1)';
      e.style.transform = 'translateY(0) scale(1) rotateX(0deg)';
      e.style.textShadow = e.classList.contains('fort')
        ? '0 0 16px rgba(255,255,255,.85), 0 0 44px rgba(255,255,255,.35), '
          + '0 0 92px rgba(91,120,255,.45)'
        : '0 2px 8px rgba(255,255,255,.1)';
    });
  }, 200));
  const fin = Math.max(...MOTS.map(w => w.r + w.d));
  setTimeout(jouer, (fin + 1) * 1000 + 4000);   // animationDelay = 4000
}
jouer();
