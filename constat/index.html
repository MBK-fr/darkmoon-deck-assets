<!doctype html><html lang="fr"><head><meta charset="utf-8">
<title>Darkmoon, le constat</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;
            font-family:'Avenir Next',Avenir,ui-sans-serif,system-ui,sans-serif;
            -webkit-font-smoothing:antialiased}
  #scene{position:absolute;inset:0;z-index:3;display:flex;align-items:center;
         justify-content:center;padding:0 96px;pointer-events:none}
  .inner{position:relative;width:58rem;max-width:58rem;text-align:center;
         pointer-events:auto}
  /* Le paragraphe : cinq couches d'ombre noire pour le détacher du décor,
     comme sur la slide « La solution ». */
  .par{margin:0;color:#fff;font-weight:300;font-size:1.66rem;line-height:1.62;
       letter-spacing:.016em;perspective:900px}
  .par.fini{perspective:none}
  /* Les mots-clés portent la couleur de la charte, et rien d'autre : pas de
     halo, pas de néon. Seules les ombres noires de lisibilité restent, les
     mêmes que sur le reste du texte. */
  .m.cle{color:#9bb8ff}
  .m{display:inline-block;margin-right:.32em;
     transition-property:opacity,filter,transform,text-shadow;
     transition-timing-function:cubic-bezier(.25,.46,.45,.94);
     will-change:filter,transform,opacity;transform-style:preserve-3d;
     backface-visibility:hidden}
  .m.pose{will-change:auto;transform-style:flat;backface-visibility:visible}
  .pied{position:absolute;left:96px;right:96px;bottom:26px;display:flex;
        justify-content:space-between;font-size:11px;letter-spacing:.16em;
        text-transform:uppercase;color:rgb(255 255 255 / .38);z-index:4}
  /* Le pied porte les deux logos et plus de texte : Darkmoon avec son mot,
     puis le logotype ASC-IT, separes par un filet. */
  .pied .marque{display:flex;align-items:center;gap:12px}
  .pied .lg-dm{height:17px;width:auto;display:block;opacity:.9}
  .pied .lg-asc{height:12px;width:auto;display:block;opacity:.62}
  .pied .tiret{width:1px;height:12px;background:rgb(255 255 255 / .22);
               display:block}
  #rideau{position:fixed;inset:0;z-index:20;background:#000;
          pointer-events:none;opacity:0}

  #ether{position:fixed;inset:0;z-index:0;overflow:hidden;background:#000}
  #ether .fluide{position:absolute;inset:-100px;
                 filter:url(#ether-filtre) blur(4px)}
  /* Le composant pose un gris neutre 128. On garde exactement sa clarte mais
     on le teinte avec les couleurs relevees dans l'animation des cartes :
     echantillonnage des cinq fonds, teintes dominantes a 187 et 195 degres
     (turquoise), 210 a 225 (indigo), et un accent chaud vers 0.
     Le degrade remplace l'aplat, le masque et le filtre ne changent pas. */
  #ether .teinte{width:100%;height:100%;background-color:rgba(128,128,128,1);
                 background-image:linear-gradient(135deg,
                   #3d8a93 0%, #3f6f9b 32%, #4a5893 58%, #6d4a58 82%,
                   #8a4a44 100%);
                 -webkit-mask-image:url('../ether/mask.png');
                 mask-image:url('../ether/mask.png');
                 -webkit-mask-size:cover;mask-size:cover;
                 -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
                 -webkit-mask-position:center;mask-position:center}
  #ether .grain{position:absolute;inset:0;
                background-image:url('../ether/noise.png');
                background-size:240px;background-repeat:repeat;opacity:.5}
</style></head><body>
<div id="ether">
  <div class="fluide">
    <svg style="position:absolute" aria-hidden="true"><defs>
      <filter id="ether-filtre">
        <feTurbulence result="undulation" numOctaves="2"
                      baseFrequency="0.0005,0.002" seed="0" type="turbulence"/>
        <feColorMatrix in="undulation" type="hueRotate" values="180">
          <animate attributeName="values" from="0" to="360" dur="5.84s"
                   repeatCount="indefinite"/>
        </feColorMatrix>
        <feColorMatrix in="dist" result="circulation" type="matrix"
          values="4 0 0 0 1  4 0 0 0 1  4 0 0 0 1  1 0 0 0 0"/>
        <feDisplacementMap in="SourceGraphic" in2="circulation" scale="100"
                           result="dist"/>
        <feDisplacementMap in="dist" in2="undulation" scale="100"
                           result="output"/>
      </filter>
    </defs></svg>
    <div class="teinte"></div>
  </div>
  <div class="grain"></div>
</div>
<div id="scene"><div class="inner">
  <p class="par" id="par"></p>
</div></div>
<div class="pied"><span class="marque"><img class="lg-dm" src="../logo-horizontal-alice.svg" alt="Darkmoon"><span class="tiret"></span><img class="lg-asc" src="../asc-it-logomark-blanc.svg" alt="ASC-IT"></span><span>03 / 12</span></div>

<script>
// ── Le texte : moteur de la slide 2, mot a mot ───────────────────────────
const NOIR = '0 0 10px rgba(0,0,0,1), 0 0 22px rgba(0,0,0,1), '
           + '0 0 44px rgba(0,0,0,.98), 0 8px 46px rgba(0,0,0,.95), '
           + '0 0 110px rgba(0,0,0,.9)';
const MOTS = [{"t": "Un", "c": false, "d": 2.5, "r": -0.009, "b": 14, "s": 0.9}, {"t": "audit", "c": false, "d": 2.487, "r": 0.075, "b": 12, "s": 0.91}, {"t": "par", "c": false, "d": 2.448, "r": 0.134, "b": 13, "s": 0.919}, {"t": "an,", "c": false, "d": 2.386, "r": 0.223, "b": 12, "s": 0.928}, {"t": "des", "c": false, "d": 2.309, "r": 0.323, "b": 15, "s": 0.936}, {"t": "attaques", "c": false, "d": 2.221, "r": 0.351, "b": 18, "s": 0.942}, {"t": "tous", "c": false, "d": 2.132, "r": 0.442, "b": 15, "s": 0.947}, {"t": "les", "c": false, "d": 2.049, "r": 0.497, "b": 18, "s": 0.949}, {"t": "jours.", "c": false, "d": 1.979, "r": 0.566, "b": 13, "s": 0.95}, {"t": "Une", "c": false, "d": 1.929, "r": 0.682, "b": 12, "s": 0.949}, {"t": "photo", "c": false, "d": 1.903, "r": 0.734, "b": 18, "s": 0.945}, {"t": "à", "c": false, "d": 1.904, "r": 0.777, "b": 15, "s": 0.94}, {"t": "l'instant", "c": true, "d": 1.931, "r": 0.847, "b": 14, "s": 0.934}, {"t": "T", "c": true, "d": 1.982, "r": 0.93, "b": 14, "s": 0.926}, {"t": ":", "c": false, "d": 2.053, "r": 1.012, "b": 16, "s": 0.917}, {"t": "un", "c": false, "d": 2.137, "r": 1.082, "b": 14, "s": 0.907}, {"t": "audit", "c": false, "d": 2.226, "r": 1.129, "b": 15, "s": 0.897}, {"t": "fige", "c": false, "d": 2.313, "r": 1.212, "b": 13, "s": 0.887}, {"t": "la", "c": false, "d": 2.39, "r": 1.291, "b": 15, "s": 0.878}, {"t": "sécurité", "c": false, "d": 2.45, "r": 1.357, "b": 18, "s": 0.869}, {"t": "à", "c": false, "d": 2.488, "r": 1.44, "b": 19, "s": 0.862}, {"t": "une", "c": false, "d": 2.5, "r": 1.499, "b": 19, "s": 0.856}, {"t": "date.", "c": false, "d": 2.485, "r": 1.557, "b": 15, "s": 0.852}, {"t": "La", "c": false, "d": 2.445, "r": 1.647, "b": 15, "s": 0.85}, {"t": "cible,", "c": false, "d": 2.383, "r": 1.68, "b": 16, "s": 0.85}, {"t": "ce", "c": false, "d": 2.304, "r": 1.771, "b": 17, "s": 0.852}, {"t": "sont", "c": false, "d": 2.216, "r": 1.85, "b": 16, "s": 0.856}, {"t": "les", "c": true, "d": 2.127, "r": 1.913, "b": 13, "s": 0.861}, {"t": "sous-traitants,", "c": true, "d": 2.044, "r": 1.957, "b": 18, "s": 0.868}, {"t": "quatre", "c": false, "d": 1.975, "r": 2.027, "b": 17, "s": 0.877}, {"t": "fois", "c": false, "d": 1.927, "r": 2.095, "b": 19, "s": 0.886}, {"t": "plus", "c": false, "d": 1.902, "r": 2.177, "b": 13, "s": 0.896}, {"t": "de", "c": false, "d": 1.905, "r": 2.262, "b": 17, "s": 0.906}, {"t": "victimes", "c": false, "d": 1.933, "r": 2.309, "b": 17, "s": 0.916}, {"t": "que", "c": false, "d": 1.986, "r": 2.39, "b": 19, "s": 0.925}, {"t": "les", "c": false, "d": 2.057, "r": 2.432, "b": 13, "s": 0.933}, {"t": "grands", "c": false, "d": 2.142, "r": 2.544, "b": 19, "s": 0.94}, {"t": "comptes", "c": false, "d": 2.231, "r": 2.599, "b": 13, "s": 0.945}, {"t": "selon", "c": false, "d": 2.318, "r": 2.636, "b": 16, "s": 0.948}, {"t": "le", "c": false, "d": 2.394, "r": 2.733, "b": 19, "s": 0.95}, {"t": "Verizon", "c": false, "d": 2.453, "r": 2.783, "b": 18, "s": 0.949}, {"t": "Data", "c": false, "d": 2.489, "r": 2.88, "b": 17, "s": 0.947}, {"t": "Breach", "c": false, "d": 2.5, "r": 2.905, "b": 19, "s": 0.943}, {"t": "Investigations", "c": false, "d": 2.483, "r": 2.989, "b": 13, "s": 0.937}, {"t": "Report", "c": false, "d": 2.442, "r": 3.064, "b": 15, "s": 0.929}, {"t": "2025.", "c": false, "d": 2.378, "r": 3.146, "b": 14, "s": 0.921}, {"t": "Et", "c": false, "d": 2.299, "r": 3.212, "b": 18, "s": 0.911}, {"t": "avec", "c": false, "d": 2.211, "r": 3.262, "b": 19, "s": 0.901}, {"t": "NIS2", "c": true, "d": 2.122, "r": 3.314, "b": 19, "s": 0.891}, {"t": "et", "c": true, "d": 2.04, "r": 3.398, "b": 16, "s": 0.882}, {"t": "DORA,", "c": true, "d": 1.972, "r": 3.489, "b": 18, "s": 0.873}, {"t": "tester", "c": false, "d": 1.925, "r": 3.556, "b": 16, "s": 0.865}, {"t": "devient", "c": false, "d": 1.902, "r": 3.615, "b": 17, "s": 0.859}, {"t": "obligatoire.", "c": false, "d": 1.906, "r": 3.682, "b": 18, "s": 0.854}];
const par = document.getElementById('par');

function poser() {
  par.textContent = '';
  par.classList.remove('fini');
  const spans = MOTS.map(w => {
    const e = document.createElement('span');
    e.className = 'm' + (w.c ? ' cle' : '');
    e.textContent = w.t;
    e.style.transitionDuration = w.d + 's';
    e.style.transitionDelay = w.r + 's';
    e.style.opacity = 0;
    e.style.filter = 'blur(' + w.b + 'px) brightness(.6)';
    e.style.transform = 'translateY(16px) scale(' + w.s + ') rotateX(-12deg)';
    e.style.textShadow = NOIR;
    par.appendChild(e);
    return { e, w };
  });
  requestAnimationFrame(() => setTimeout(() => {
    spans.forEach(({ e, w }) => {
      e.style.opacity = 1;
      e.style.filter = 'blur(0px) brightness(1)';
      e.style.transform = 'translateY(0) scale(1) rotateX(0deg)';
      e.style.textShadow = NOIR;
    });
  }, 120));
  // une fois pose, on libere le calque composite, sinon le mot ramollit
  const fin = Math.max(...spans.map(({ w }) => w.r + w.d));
  setTimeout(() => {
    spans.forEach(({ e }) => {
      e.style.filter = '';
      e.style.transform = '';
      e.style.willChange = 'auto';
      e.classList.add('pose');
    });
    par.classList.add('fini');
  }, (fin + 0.25) * 1000);
}

// ── Ouverture : rideau noir, decor en fondu ──────────────────────────────
const rideau = document.createElement('div');
rideau.id = 'rideau';
document.body.appendChild(rideau);
const decor = document.getElementById('ether');
const COURBE = 'cubic-bezier(.22,.61,.36,1)';
let animations = [], derniereOuverture = 0;

function ouvrir() {
  derniereOuverture = performance.now();
  animations.forEach(a => a.cancel());
  animations = [
    rideau.animate([{ opacity: 1 }, { opacity: 0 }],
      { duration: 2200, easing: COURBE, fill: 'backwards' }),
    ...(decor ? [decor.animate([{ opacity: 0 }, { opacity: 1 }],
      { duration: 2600, easing: COURBE, fill: 'backwards' })] : [])
  ];
  poser();
}
ouvrir();

let precedent = performance.now(), reprise = false, rapides = 0;
(function veille() {
  const t = performance.now(), dt = t - precedent;
  precedent = t;
  if (dt > 400) { reprise = true; rapides = 0; }
  else if (reprise) {
    rapides = dt < 40 ? rapides + 1 : 0;
    if (rapides >= 6) {
      reprise = false; rapides = 0;
      if (t - derniereOuverture > 2500) ouvrir();
    }
  }
  requestAnimationFrame(veille);
})();
</script>

</body></html>
