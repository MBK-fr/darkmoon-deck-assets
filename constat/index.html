<!doctype html><html lang="fr"><head><meta charset="utf-8">
<title>Darkmoon, le constat</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;
            font-family:'Avenir Next',Avenir,ui-sans-serif,system-ui,sans-serif;
            -webkit-font-smoothing:antialiased}
  #scene{position:absolute;inset:0;z-index:3;display:flex;align-items:center;
         justify-content:center;padding:0 96px;pointer-events:none}
  .inner{position:relative;width:58rem;max-width:58rem;text-align:center;
         pointer-events:auto}
  /* Le paragraphe : cinq couches d'ombre noire pour le détacher du décor,
     comme sur la slide « La solution ». */
  .par{margin:0;color:#fff;font-weight:300;font-size:1.66rem;line-height:1.62;
       letter-spacing:.016em;perspective:900px}
  .par.fini{perspective:none}
  /* Les mots-clés portent la couleur de la charte, et rien d'autre : pas de
     halo, pas de néon. Seules les ombres noires de lisibilité restent, les
     mêmes que sur le reste du texte. */
  .m.cle{color:#9bb8ff}
  .m{display:inline-block;margin-right:.32em;
     transition-property:opacity,filter,transform,text-shadow;
     transition-timing-function:cubic-bezier(.25,.46,.45,.94);
     will-change:filter,transform,opacity;transform-style:preserve-3d;
     backface-visibility:hidden}
  .m.pose{will-change:auto;transform-style:flat;backface-visibility:visible}
  .pied{position:absolute;left:96px;right:96px;bottom:26px;display:flex;
        justify-content:space-between;font-size:11px;letter-spacing:.16em;
        text-transform:uppercase;color:rgb(255 255 255 / .38);z-index:4}
  /* Le pied porte les deux logos et plus de texte : Darkmoon avec son mot,
     puis le logotype ASC-IT, separes par un filet. */
  .pied .marque{display:flex;align-items:center;gap:12px}
  .pied .lg-dm{height:17px;width:auto;display:block;opacity:.9}
  .pied .lg-asc{height:12px;width:auto;display:block;opacity:.62}
  .pied .tiret{width:1px;height:12px;background:rgb(255 255 255 / .22);
               display:block}
  #rideau{position:fixed;inset:0;z-index:20;background:#000;
          pointer-events:none;opacity:0}

  #ether{position:fixed;inset:0;z-index:0;overflow:hidden;background:#000}
  #ether .fluide{position:absolute;inset:0;
                 background-image:url('../ether/silk.webp?r=2');
                 background-size:cover;background-position:center;
                 background-repeat:no-repeat}
  #ether .grain{position:absolute;inset:0;
                background-image:url('../ether/noise.png');
                background-size:240px;background-repeat:repeat;opacity:.5}
</style></head><body>
<div id="ether">
  <div class="fluide"></div>
  <div class="grain"></div>
</div>
<div id="scene"><div class="inner">
  <p class="par" id="par"></p>
</div></div>
<div class="pied"><span class="marque"><img class="lg-dm" src="../logo-horizontal-alice.svg" alt="Darkmoon"><span class="tiret"></span><img class="lg-asc" src="../asc-it-logomark-blanc.svg" alt="ASC-IT"></span><span>03 / 12</span></div>

<script>
// ── Le texte : moteur de la slide 2, mot a mot ───────────────────────────
const NOIR = '0 0 10px rgba(0,0,0,1), 0 0 22px rgba(0,0,0,1), '
           + '0 0 44px rgba(0,0,0,.98), 0 8px 46px rgba(0,0,0,.95), '
           + '0 0 110px rgba(0,0,0,.9)';
const MOTS = [{"t": "Un", "c": false, "d": 0.7, "r": -0.009, "b": 14, "s": 0.9}, {"t": "audit", "c": false, "d": 0.696, "r": 0.021, "b": 12, "s": 0.91}, {"t": "par", "c": false, "d": 0.683, "r": 0.03, "b": 13, "s": 0.919}, {"t": "an,", "c": false, "d": 0.662, "r": 0.069, "b": 12, "s": 0.928}, {"t": "des", "c": false, "d": 0.636, "r": 0.12, "b": 15, "s": 0.936}, {"t": "attaques", "c": false, "d": 0.607, "r": 0.101, "b": 18, "s": 0.942}, {"t": "tous", "c": false, "d": 0.577, "r": 0.143, "b": 15, "s": 0.947}, {"t": "les", "c": false, "d": 0.55, "r": 0.151, "b": 18, "s": 0.949}, {"t": "jours.", "c": false, "d": 0.526, "r": 0.173, "b": 13, "s": 0.95}, {"t": "Une", "c": false, "d": 0.51, "r": 0.241, "b": 12, "s": 0.949}, {"t": "photo", "c": false, "d": 0.501, "r": 0.245, "b": 18, "s": 0.945}, {"t": "à", "c": false, "d": 0.501, "r": 0.242, "b": 15, "s": 0.94}, {"t": "l'instant", "c": true, "d": 0.51, "r": 0.265, "b": 14, "s": 0.934}, {"t": "T", "c": true, "d": 0.527, "r": 0.301, "b": 14, "s": 0.926}, {"t": ":", "c": false, "d": 0.551, "r": 0.336, "b": 16, "s": 0.917}, {"t": "un", "c": false, "d": 0.579, "r": 0.36, "b": 14, "s": 0.907}, {"t": "audit", "c": false, "d": 0.609, "r": 0.361, "b": 15, "s": 0.897}, {"t": "fige", "c": false, "d": 0.638, "r": 0.397, "b": 13, "s": 0.887}, {"t": "la", "c": false, "d": 0.663, "r": 0.43, "b": 15, "s": 0.878}, {"t": "sécurité", "c": false, "d": 0.683, "r": 0.449, "b": 18, "s": 0.869}, {"t": "à", "c": false, "d": 0.696, "r": 0.486, "b": 19, "s": 0.862}, {"t": "une", "c": false, "d": 0.7, "r": 0.499, "b": 19, "s": 0.856}, {"t": "date.", "c": false, "d": 0.695, "r": 0.511, "b": 15, "s": 0.852}, {"t": "La", "c": false, "d": 0.682, "r": 0.556, "b": 15, "s": 0.85}, {"t": "cible,", "c": false, "d": 0.661, "r": 0.543, "b": 16, "s": 0.85}, {"t": "ce", "c": false, "d": 0.635, "r": 0.588, "b": 17, "s": 0.852}, {"t": "sont", "c": false, "d": 0.605, "r": 0.621, "b": 16, "s": 0.856}, {"t": "les", "c": true, "d": 0.576, "r": 0.637, "b": 13, "s": 0.861}, {"t": "sous-traitants,", "c": true, "d": 0.548, "r": 0.636, "b": 18, "s": 0.868}, {"t": "quatre", "c": false, "d": 0.525, "r": 0.661, "b": 17, "s": 0.877}, {"t": "fois", "c": false, "d": 0.509, "r": 0.683, "b": 19, "s": 0.886}, {"t": "plus", "c": false, "d": 0.501, "r": 0.719, "b": 13, "s": 0.896}, {"t": "de", "c": false, "d": 0.502, "r": 0.759, "b": 17, "s": 0.906}, {"t": "victimes", "c": false, "d": 0.511, "r": 0.76, "b": 17, "s": 0.916}, {"t": "que", "c": false, "d": 0.529, "r": 0.795, "b": 19, "s": 0.925}, {"t": "les", "c": false, "d": 0.552, "r": 0.792, "b": 13, "s": 0.933}, {"t": "grands", "c": false, "d": 0.581, "r": 0.858, "b": 19, "s": 0.94}, {"t": "comptes", "c": false, "d": 0.61, "r": 0.868, "b": 13, "s": 0.945}, {"t": "selon", "c": false, "d": 0.639, "r": 0.859, "b": 16, "s": 0.948}, {"t": "le", "c": false, "d": 0.665, "r": 0.911, "b": 19, "s": 0.95}, {"t": "Verizon", "c": false, "d": 0.684, "r": 0.915, "b": 18, "s": 0.949}, {"t": "Data", "c": false, "d": 0.696, "r": 0.968, "b": 17, "s": 0.947}, {"t": "Breach", "c": false, "d": 0.7, "r": 0.947, "b": 19, "s": 0.943}, {"t": "Investigations", "c": false, "d": 0.694, "r": 0.986, "b": 13, "s": 0.937}, {"t": "Report", "c": false, "d": 0.681, "r": 1.016, "b": 15, "s": 0.929}, {"t": "2025.", "c": false, "d": 0.659, "r": 1.052, "b": 14, "s": 0.921}, {"t": "Et", "c": false, "d": 0.633, "r": 1.073, "b": 18, "s": 0.911}, {"t": "avec", "c": false, "d": 0.604, "r": 1.078, "b": 19, "s": 0.901}, {"t": "NIS2", "c": true, "d": 0.574, "r": 1.085, "b": 19, "s": 0.891}, {"t": "et", "c": true, "d": 0.547, "r": 1.123, "b": 16, "s": 0.882}, {"t": "DORA,", "c": true, "d": 0.524, "r": 1.17, "b": 18, "s": 0.873}, {"t": "tester", "c": false, "d": 0.508, "r": 1.191, "b": 16, "s": 0.865}, {"t": "devient", "c": false, "d": 0.501, "r": 1.206, "b": 17, "s": 0.859}, {"t": "obligatoire.", "c": false, "d": 0.502, "r": 1.227, "b": 18, "s": 0.854}];
const par = document.getElementById('par');

function poser() {
  par.textContent = '';
  par.classList.remove('fini');
  const spans = MOTS.map(w => {
    const e = document.createElement('span');
    e.className = 'm' + (w.c ? ' cle' : '');
    e.textContent = w.t;
    e.style.transitionDuration = w.d + 's';
    e.style.transitionDelay = w.r + 's';
    e.style.opacity = 0;
    e.style.filter = 'blur(' + w.b + 'px) brightness(.6)';
    e.style.transform = 'translateY(16px) scale(' + w.s + ') rotateX(-12deg)';
    e.style.textShadow = NOIR;
    par.appendChild(e);
    return { e, w };
  });
  requestAnimationFrame(() => setTimeout(() => {
    spans.forEach(({ e, w }) => {
      e.style.opacity = 1;
      e.style.filter = 'blur(0px) brightness(1)';
      e.style.transform = 'translateY(0) scale(1) rotateX(0deg)';
      e.style.textShadow = NOIR;
    });
  }, 120));
  // une fois pose, on libere le calque composite, sinon le mot ramollit
  const fin = Math.max(...spans.map(({ w }) => w.r + w.d));
  setTimeout(() => {
    spans.forEach(({ e }) => {
      e.style.filter = '';
      e.style.transform = '';
      e.style.willChange = 'auto';
      e.classList.add('pose');
    });
    par.classList.add('fini');
  }, (fin + 0.25) * 1000);
}

// ── Ouverture : rideau noir, decor en fondu ──────────────────────────────
const rideau = document.createElement('div');
rideau.id = 'rideau';
document.body.appendChild(rideau);
const decor = document.getElementById('ether');
const COURBE = 'cubic-bezier(.22,.61,.36,1)';
let animations = [], derniereOuverture = 0;

function ouvrir() {
  derniereOuverture = performance.now();
  animations.forEach(a => a.cancel());
  animations = [
    rideau.animate([{ opacity: 1 }, { opacity: 0 }],
      { duration: 800, easing: COURBE, fill: 'backwards' }),
    ...(decor ? [decor.animate([{ opacity: 0 }, { opacity: 1 }],
      { duration: 900, easing: COURBE, fill: 'backwards' })] : [])
  ];
  poser();
}
ouvrir();

let precedent = performance.now(), reprise = false, rapides = 0;
(function veille() {
  const t = performance.now(), dt = t - precedent;
  precedent = t;
  if (dt > 400) { reprise = true; rapides = 0; }
  else if (reprise) {
    rapides = dt < 40 ? rapides + 1 : 0;
    if (rapides >= 6) {
      reprise = false; rapides = 0;
      if (t - derniereOuverture > 2500) ouvrir();
    }
  }
  requestAnimationFrame(veille);
})();
</script>

</body></html>
