<!doctype html><html lang="fr"><head><meta charset="utf-8">
<title>Darkmoon, le constat</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;
            font-family:'Avenir Next',Avenir,ui-sans-serif,system-ui,sans-serif;
            -webkit-font-smoothing:antialiased}
  #scene{position:absolute;inset:0;z-index:3;display:flex;align-items:center;
         justify-content:center;padding:0 96px;pointer-events:none}
  .inner{position:relative;width:58rem;max-width:58rem;text-align:center;
         pointer-events:auto}
  /* Le paragraphe : cinq couches d'ombre noire pour le détacher du décor,
     comme sur la slide « La solution ». */
  .par{margin:0;color:#fff;font-weight:300;font-size:1.66rem;line-height:1.62;
       letter-spacing:.016em;perspective:900px}
  .par.fini{perspective:none}
  /* Les mots-clés portent la couleur de la charte, et rien d'autre : pas de
     halo, pas de néon. Seules les ombres noires de lisibilité restent, les
     mêmes que sur le reste du texte. */
  .m.cle{color:#9bb8ff}
  .m{display:inline-block;margin-right:.32em;
     transition-property:opacity,filter,transform,text-shadow;
     transition-timing-function:cubic-bezier(.6,.04,.22,1);
     will-change:filter,transform,opacity;transform-style:preserve-3d;
     backface-visibility:hidden}
  .m.pose{will-change:auto;transform-style:flat;backface-visibility:visible}
  .pied{position:absolute;left:96px;right:96px;bottom:26px;display:flex;
        justify-content:space-between;font-size:11px;letter-spacing:.16em;
        text-transform:uppercase;color:rgb(255 255 255 / .38);z-index:4}
  /* Le pied porte les deux logos et plus de texte : Darkmoon avec son mot,
     puis le logotype ASC-IT, separes par un filet. */
  .pied .marque{display:flex;align-items:center;gap:12px}
  .pied .lg-dm{height:17px;width:auto;display:block;opacity:.9}
  .pied .lg-asc{height:12px;width:auto;display:block;opacity:.62}
  .pied .tiret{width:1px;height:12px;background:rgb(255 255 255 / .22);
               display:block}
  #rideau{position:fixed;inset:0;z-index:20;background:#000;
          pointer-events:none;opacity:0}

  #ether{position:fixed;inset:0;z-index:0;overflow:hidden;background:#000}
  #ether .fluide{position:absolute;inset:0;width:100%;height:100%;
                 object-fit:cover;object-position:center;
                 pointer-events:none;border:0;display:block}
  #ether .grain{position:absolute;inset:0;
                background-image:url('../ether/noise.png');
                background-size:240px;background-repeat:repeat;opacity:.5}

  .langue{position:absolute;top:22px;right:72px;z-index:6;display:flex;
          align-items:center;gap:9px;font-size:11px;letter-spacing:.16em;
          text-transform:uppercase;font-weight:500;
          font-family:'Avenir Next','Avenir',system-ui,sans-serif;
          -webkit-user-select:none;user-select:none}
  .langue a{color:rgb(255 255 255 / .38);text-decoration:none;
            padding:3px 5px;border-radius:7px;line-height:1;
            transition:color .22s ease,background-color .22s ease}
  .langue a:hover{color:rgb(255 255 255 / .72);
                  background:rgb(255 255 255 / .05)}
  .langue a.on{color:rgb(255 255 255 / .92)}
  .langue .filet{width:1px;height:10px;background:rgb(255 255 255 / .22)}
</style><script>
(function(){
  var ici = 'fr', jumelle = '../constat-en/';
  try {
    var choisi = localStorage.getItem('darkmoon-deck-langue');
    if (choisi && choisi !== ici) location.replace(jumelle);
  } catch (e) {}
})();
</script></head><body>
<div id="ether">
  <video class="fluide" autoplay muted loop playsinline preload="auto"
         disablepictureinpicture tabindex="-1" aria-hidden="true"
         poster="../ether/silk-pose.jpg">
    <source src="../ether/silk.webm" type="video/webm">
    <source src="../ether/silk.mp4" type="video/mp4">
  </video>
  <div class="grain"></div>
</div>
<div id="scene"><div class="inner">
  <p class="par" id="par"></p>
</div></div>
<div class="pied"><span class="marque"><img class="lg-dm" src="../logo-horizontal-alice.svg" alt="Darkmoon"><span class="tiret"></span><img class="lg-asc" src="../asc-it-logomark-blanc.svg" alt="ASC-IT"></span><span>03 / 12</span></div>

<script>
// ── Le texte : moteur de la slide 2, mot a mot ───────────────────────────
const NOIR = '0 0 10px rgba(0,0,0,1), 0 0 22px rgba(0,0,0,1), '
           + '0 0 44px rgba(0,0,0,.98)';
const MOTS = [{"t": "Un", "c": false, "d": 0.937, "r": -0.004, "b": 14, "s": 0.9}, {"t": "audit", "c": false, "d": 0.931, "r": 0.035, "b": 12, "s": 0.91}, {"t": "par", "c": false, "d": 0.916, "r": 0.063, "b": 13, "s": 0.919}, {"t": "an,", "c": false, "d": 0.892, "r": 0.106, "b": 12, "s": 0.928}, {"t": "des", "c": false, "d": 0.861, "r": 0.156, "b": 15, "s": 0.936}, {"t": "attaques", "c": false, "d": 0.827, "r": 0.171, "b": 18, "s": 0.942}, {"t": "tous", "c": false, "d": 0.792, "r": 0.215, "b": 15, "s": 0.947}, {"t": "les", "c": false, "d": 0.76, "r": 0.243, "b": 18, "s": 0.949}, {"t": "jours.", "c": false, "d": 0.732, "r": 0.279, "b": 13, "s": 0.95}, {"t": "Une", "c": false, "d": 0.713, "r": 0.337, "b": 12, "s": 0.949}, {"t": "photo", "c": false, "d": 0.703, "r": 0.362, "b": 18, "s": 0.945}, {"t": "à", "c": false, "d": 0.703, "r": 0.385, "b": 15, "s": 0.94}, {"t": "l'instant", "c": true, "d": 0.714, "r": 0.42, "b": 14, "s": 0.934}, {"t": "T", "c": true, "d": 0.734, "r": 0.463, "b": 14, "s": 0.926}, {"t": ":", "c": false, "d": 0.761, "r": 0.504, "b": 16, "s": 0.917}, {"t": "un", "c": false, "d": 0.794, "r": 0.54, "b": 14, "s": 0.907}, {"t": "audit", "c": false, "d": 0.829, "r": 0.565, "b": 15, "s": 0.897}, {"t": "fige", "c": false, "d": 0.864, "r": 0.607, "b": 13, "s": 0.887}, {"t": "la", "c": false, "d": 0.894, "r": 0.647, "b": 15, "s": 0.878}, {"t": "sécurité", "c": false, "d": 0.917, "r": 0.68, "b": 18, "s": 0.869}, {"t": "à", "c": false, "d": 0.932, "r": 0.723, "b": 19, "s": 0.862}, {"t": "une", "c": false, "d": 0.937, "r": 0.753, "b": 19, "s": 0.856}, {"t": "date.", "c": false, "d": 0.931, "r": 0.783, "b": 15, "s": 0.852}, {"t": "La", "c": false, "d": 0.915, "r": 0.83, "b": 15, "s": 0.85}, {"t": "cible,", "c": false, "d": 0.89, "r": 0.848, "b": 16, "s": 0.85}, {"t": "ce", "c": false, "d": 0.86, "r": 0.894, "b": 17, "s": 0.852}, {"t": "sont", "c": false, "d": 0.825, "r": 0.934, "b": 16, "s": 0.856}, {"t": "les", "c": true, "d": 0.79, "r": 0.967, "b": 13, "s": 0.861}, {"t": "sous-traitants,", "c": true, "d": 0.758, "r": 0.99, "b": 18, "s": 0.868}, {"t": "quatre", "c": false, "d": 0.731, "r": 1.026, "b": 17, "s": 0.877}, {"t": "fois", "c": false, "d": 0.712, "r": 1.062, "b": 19, "s": 0.886}, {"t": "plus", "c": false, "d": 0.702, "r": 1.103, "b": 13, "s": 0.896}, {"t": "de", "c": false, "d": 0.703, "r": 1.147, "b": 17, "s": 0.906}, {"t": "victimes", "c": false, "d": 0.714, "r": 1.172, "b": 17, "s": 0.916}, {"t": "que", "c": false, "d": 0.735, "r": 1.214, "b": 19, "s": 0.925}, {"t": "les", "c": false, "d": 0.763, "r": 1.236, "b": 13, "s": 0.933}, {"t": "grands", "c": false, "d": 0.796, "r": 1.293, "b": 19, "s": 0.94}, {"t": "comptes", "c": false, "d": 0.831, "r": 1.322, "b": 13, "s": 0.945}, {"t": "selon", "c": false, "d": 0.865, "r": 1.341, "b": 16, "s": 0.948}, {"t": "le", "c": false, "d": 0.895, "r": 1.391, "b": 19, "s": 0.95}, {"t": "Verizon", "c": false, "d": 0.918, "r": 1.417, "b": 18, "s": 0.949}, {"t": "Data", "c": false, "d": 0.932, "r": 1.468, "b": 17, "s": 0.947}, {"t": "Breach", "c": false, "d": 0.937, "r": 1.482, "b": 19, "s": 0.943}, {"t": "Investigations", "c": false, "d": 0.93, "r": 1.525, "b": 13, "s": 0.937}, {"t": "Report", "c": false, "d": 0.914, "r": 1.564, "b": 15, "s": 0.929}, {"t": "2025.", "c": false, "d": 0.889, "r": 1.606, "b": 14, "s": 0.921}, {"t": "Et", "c": false, "d": 0.858, "r": 1.641, "b": 18, "s": 0.911}, {"t": "avec", "c": false, "d": 0.823, "r": 1.667, "b": 19, "s": 0.901}, {"t": "NIS2", "c": true, "d": 0.788, "r": 1.694, "b": 19, "s": 0.891}, {"t": "et", "c": true, "d": 0.756, "r": 1.738, "b": 16, "s": 0.882}, {"t": "DORA,", "c": true, "d": 0.73, "r": 1.785, "b": 18, "s": 0.873}, {"t": "tester", "c": false, "d": 0.711, "r": 1.819, "b": 16, "s": 0.865}, {"t": "devient", "c": false, "d": 0.702, "r": 1.851, "b": 17, "s": 0.859}, {"t": "obligatoire.", "c": false, "d": 0.704, "r": 1.885, "b": 18, "s": 0.854}];
const par = document.getElementById('par');

function poser() {
  par.textContent = '';
  par.classList.remove('fini');
  const spans = MOTS.map(w => {
    const e = document.createElement('span');
    e.className = 'm' + (w.c ? ' cle' : '');
    e.textContent = w.t;
    e.style.transitionDuration = w.d + 's';
    e.style.transitionDelay = w.r + 's';
    e.style.opacity = 0;
    e.style.filter = 'blur(' + w.b + 'px) brightness(.6)';
    e.style.transform = 'translateY(16px) scale(' + w.s + ') rotateX(-12deg)';
    e.style.textShadow = NOIR;
    par.appendChild(e);
    return { e, w };
  });
  requestAnimationFrame(() => setTimeout(() => {
    spans.forEach(({ e, w }) => {
      e.style.opacity = 1;
      e.style.filter = 'blur(0px) brightness(1)';
      e.style.transform = 'translateY(0) scale(1) rotateX(0deg)';
      e.style.textShadow = NOIR;
    });
  }, 120));
  // une fois pose, on libere le calque composite, sinon le mot ramollit
  const fin = Math.max(...spans.map(({ w }) => w.r + w.d));
  setTimeout(() => {
    spans.forEach(({ e }) => {
      e.style.filter = '';
      e.style.transform = '';
      e.style.willChange = 'auto';
      e.classList.add('pose');
    });
    par.classList.add('fini');
  }, (fin + 0.25) * 1000);
}

// ── Ouverture : rideau noir, decor en fondu ──────────────────────────────
const rideau = document.createElement('div');
rideau.id = 'rideau';
document.body.appendChild(rideau);
const decor = document.getElementById('ether');
const COURBE = 'cubic-bezier(.6,.04,.22,1)';
let animations = [], derniereOuverture = 0;

function ouvrir() {
  derniereOuverture = performance.now();
  animations.forEach(a => a.cancel());
  animations = [
    rideau.animate([{ opacity: 1 }, { opacity: 0 }],
      { duration: 2340, easing: COURBE, fill: 'backwards' }),
    ...(decor ? [decor.animate([{ opacity: 0 }, { opacity: 1 }],
      { duration: 2600, easing: COURBE, fill: 'backwards' })] : [])
  ];
  poser();
}
ouvrir();

let precedent = performance.now(), reprise = false, rapides = 0;
(function veille() {
  const t = performance.now(), dt = t - precedent;
  precedent = t;
  if (dt > 400) { reprise = true; rapides = 0; }
  else if (reprise) {
    rapides = dt < 40 ? rapides + 1 : 0;
    if (rapides >= 6) {
      reprise = false; rapides = 0;
      if (t - derniereOuverture > 2500) ouvrir();
    }
  }
  requestAnimationFrame(veille);
})();
</script>

<div class="langue">
  <a class="on" href="../constat/" data-l="fr">FR</a><span class="filet"></span><a
      href="../constat-en/" data-l="en">EN</a>
</div>
<script>
document.querySelectorAll('.langue a').forEach(function (a) {
  a.addEventListener('click', function () {
    try { localStorage.setItem('darkmoon-deck-langue', a.dataset.l); } catch (e) {}
  });
});
</script>
</body></html>
