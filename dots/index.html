<!doctype html><html lang="fr"><head><meta charset="utf-8">
<style>
  html,body{margin:0;height:100%;background:#0a0a0a;overflow:hidden;
            font-family:ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";color:#fff}
  .scene{height:100%;box-sizing:border-box;padding:44px 76px 34px;
         display:flex;flex-direction:column}

  /* ── blur-text-animation */
  .phrase{font-size:23px;font-weight:300;line-height:1.6;letter-spacing:.01em;
          margin:0;max-width:1128px;perspective:900px}
  .m{display:inline-block;margin-right:.35em;opacity:0;
     transition-property:opacity,filter,transform,text-shadow;
     transition-timing-function:cubic-bezier(.25,.46,.45,.94);
     will-change:filter,transform,opacity;transform-style:preserve-3d;
     backface-visibility:hidden}

  /* ── moving-dot-card, structure et keyframes du composant */
  .cartes{margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
  /* 600 × 500 dans la capture : on garde le ratio 1,20 */
  .outer{position:relative;width:100%;aspect-ratio:1.2;border-radius:14px;
         padding:1px;background:radial-gradient(circle 130px at 12% 2%,
         rgba(255,255,255,.55),transparent 55%),rgba(255,255,255,.07);
         opacity:0;animation:apparition 1.6s cubic-bezier(.25,.46,.45,.94) var(--d) both}
  @keyframes apparition{from{opacity:0;filter:blur(10px);transform:translateY(14px)}
                        to{opacity:1;filter:blur(0);transform:none}}
  .dot{position:absolute;width:5px;height:5px;background:#fff;border-radius:50%;
       z-index:3;box-shadow:0 0 10px #fff;animation:moveDot 6s linear infinite}
  @keyframes moveDot{
    0%,100%{top:10%;right:10%}
    25%{top:10%;right:calc(100% - 35px)}
    50%{top:calc(100% - 30px);right:calc(100% - 35px)}
    75%{top:calc(100% - 30px);right:10%}}
  .card{position:relative;height:100%;border-radius:13px;background:#181919;
        display:flex;flex-direction:column;align-items:center;
        justify-content:center;overflow:hidden}
  .ray{position:absolute;width:66%;height:34%;border-radius:100px;
       background:#e8eefc;opacity:.30;filter:blur(52px);top:-16%;left:-14%;
       transform:rotate(38deg)}
  .text{font-size:56px;font-weight:700;letter-spacing:-.02em;
        background:linear-gradient(45deg,#e8f1fd 0%,#63baf9 100%);
        -webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .label{font-size:14px;letter-spacing:.24em;text-transform:uppercase;
         color:#9b9b9f;margin-top:10px}
  .line{position:absolute;background:rgba(255,255,255,.12)}
  .topl{top:10%;left:0;width:100%;height:1px}
  .bottoml{top:89%;left:0;width:100%;height:1px}
  .leftl{left:10%;top:0;height:100%;width:1px}
  .rightl{left:89%;top:0;height:100%;width:1px}

  .bas{display:flex;justify-content:space-between;font-size:11.5px;
       letter-spacing:.14em;color:#fff;opacity:.34;margin-top:22px;
       animation:apparition 1.6s ease 3.6s both}
</style></head><body>
