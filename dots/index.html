<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
            font-family:ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";color:#fff}
  .scene{height:100%;box-sizing:border-box;padding:54px 76px 40px;
         display:flex;flex-direction:column}

  /* ── blur-text-animation */
  .phrase{font-size:27px;font-weight:300;line-height:1.62;letter-spacing:.01em;
          margin:0;max-width:1128px;perspective:900px}
  .m{display:inline-block;margin-right:.35em;opacity:0;
     transition-property:opacity,filter,transform,text-shadow;
     transition-timing-function:cubic-bezier(.25,.46,.45,.94);
     will-change:filter,transform,opacity;transform-style:preserve-3d;
     backface-visibility:hidden}

  /* ── moving-dot-card, structure et keyframes du composant */
  .cartes{margin-top:auto;display:grid;grid-template-columns:repeat(6,1fr);gap:18px}
  .outer{position:relative;width:100%;height:132px;border-radius:14px;
         padding:1px;background:radial-gradient(circle 100px at 20% 0%,
         rgba(255,255,255,.22),transparent 60%),rgba(255,255,255,.05);
         opacity:0;animation:apparition 1.6s cubic-bezier(.25,.46,.45,.94) var(--d) both}
  @keyframes apparition{from{opacity:0;filter:blur(10px);transform:translateY(14px)}
                        to{opacity:1;filter:blur(0);transform:none}}
  .dot{position:absolute;width:5px;height:5px;background:#fff;border-radius:50%;
       z-index:3;box-shadow:0 0 10px #fff;animation:moveDot 6s linear infinite}
  @keyframes moveDot{
    0%,100%{top:10%;right:10%}
    25%{top:10%;right:calc(100% - 35px)}
    50%{top:calc(100% - 30px);right:calc(100% - 35px)}
    75%{top:calc(100% - 30px);right:10%}}
  .card{position:relative;height:100%;border-radius:13px;background:#0a0a0c;
        display:flex;flex-direction:column;align-items:center;
        justify-content:center;overflow:hidden}
  .ray{position:absolute;width:200px;height:44px;border-radius:100px;
       background:#c7d2fe;opacity:.28;filter:blur(38px);top:-14px;left:-38px;
       transform:rotate(40deg)}
  .text{font-size:30px;font-weight:700;letter-spacing:-.02em;
        background:linear-gradient(45deg,#dbeafe 0%,#3b82f6 100%);
        -webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .label{font-size:10px;letter-spacing:.22em;text-transform:uppercase;
         color:#8a8a92;margin-top:6px}
  .line{position:absolute;background:rgba(255,255,255,.12)}
  .topl{top:14%;left:0;width:100%;height:1px}
  .bottoml{bottom:14%;left:0;width:100%;height:1px}
  .leftl{left:14%;top:0;height:100%;width:1px}
  .rightl{right:14%;top:0;height:100%;width:1px}

  .bas{display:flex;justify-content:space-between;font-size:11.5px;
       letter-spacing:.14em;color:#fff;opacity:.34;margin-top:22px;
       animation:apparition 1.6s ease 3.6s both}
</style></head><body>
