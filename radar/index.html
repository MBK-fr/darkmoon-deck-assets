<!doctype html><html lang="fr"><head><meta charset="utf-8">
<title>Darkmoon, la solution</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;
            font-family:'Avenir Next',Avenir,ui-sans-serif,system-ui,sans-serif;
            -webkit-font-smoothing:antialiased}
  *{box-sizing:border-box}

  /* ── Le texte va DANS les emplacements du composant ───────────────────
     Le demonstrateur pose un `h3` puis un `p` en bas a gauche de sa carte,
     `absolute bottom-5 left-0 w-full px-3`. C'est la que le texte de la
     slide 6 prend place : le titre du PPTX dans le `h3`, sa phrase dans le
     `p`. Meme emplacement, meme ordre ; seules la taille et la police
     changent, pour rester dans le registre de la slide 2. */
  #scene{position:absolute;inset:0;z-index:3;display:flex;
         align-items:flex-end;padding:0 76px 92px;pointer-events:none}
  .inner{position:relative;width:56rem;max-width:56rem;text-align:left;
         pointer-events:auto}
  .inner::before{content:"";position:absolute;inset:-40% -14% -60%;
                 z-index:-1;
                 background:radial-gradient(64% 60% at 30% 60%,
                   rgba(0,0,0,.86) 0%, rgba(0,0,0,.64) 42%,
                   rgba(0,0,0,.28) 70%, rgba(0,0,0,0) 100%)}
  .eyebrow{font-size:11px;letter-spacing:.42em;text-transform:uppercase;
           color:rgb(220 234 244 / .55);margin-bottom:22px}
  .txt{color:#fff;font-size:1.95rem;line-height:1.5;letter-spacing:.012em;
       font-weight:300;margin:0;
       font-family:'Avenir Next','Avenir',system-ui,sans-serif;
       perspective:900px}
  .m{display:inline-block;margin-right:.35em;
     transition-property:opacity,filter,transform,text-shadow;
     transition-timing-function:cubic-bezier(.25,.46,.45,.94);
     will-change:filter,transform,opacity;transform-style:preserve-3d;
     backface-visibility:hidden}
  .m.pose{will-change:auto;transform-style:flat;backface-visibility:visible}
  /* Les trois piliers du PPTX, en colonnes separees par un filet, comme une
     table editoriale : le chiffre en exposant, le titre, la ligne. */
  .sous{margin:16px 0 0;font-size:16.5px;line-height:1.6;font-weight:300;
        color:rgb(255 255 255 / .74);max-width:56ch}
  .piliers{margin-top:30px;display:grid;grid-template-columns:repeat(3,1fr);
           gap:0;max-width:44rem}
  .pilier{padding:0 30px;border-left:1px solid rgb(220 234 244 / .14)}
  .pilier:first-child{padding-left:0;border-left:0}
  .pilier .n{font-size:10.5px;letter-spacing:.24em;color:rgb(220 234 244 / .45)}
  .pilier .t{margin-top:10px;font-size:15px;color:#fff;font-weight:400;
             letter-spacing:.01em}
  .pilier .d{margin-top:7px;font-size:13.5px;line-height:1.62;
             color:rgb(255 255 255 / .6)}
  .pied{position:absolute;left:76px;right:76px;bottom:26px;display:flex;
        justify-content:space-between;font-size:11px;letter-spacing:.16em;
        text-transform:uppercase;color:rgb(255 255 255 / .38);z-index:4}

  /* ── Le composant, en pleine largeur et sans carte ───────────────────
     Le demonstrateur enferme la scene dans une carte de 350 px, `rounded-md
     border border-neutral-800 bg-black`. Cette carte disparait : plus de
     fond, plus de bordure, plus de rayon, la scene se fond dans le decor de
     la slide. Sa geometrie, elle, est conservee et mise a l'echelle : les
     memes quatre arcs aux memes largeurs relatives, le meme balayage, les
     memes neuf points, le meme disque au pied. */
  #radar{position:absolute;left:0;right:0;top:-6%;height:74%;z-index:2;
         pointer-events:none;overflow:hidden}
  #radar .haut{position:absolute;inset:0}
  /* le balayage : meme degrade, meme sequence, meme duree, agrandi */
  .faisceau{position:absolute;bottom:0;left:50%;width:760px;height:760px;
    transform-origin:bottom left;pointer-events:none;
    background:radial-gradient(circle at 0% 100%,
      rgba(255,255,255,.3) 5%, transparent 60%);
    animation:balayage 18s ease-in-out infinite}
  @keyframes balayage{
    0%{opacity:.7;transform:rotate(-55deg)}
    11%{opacity:1;transform:rotate(-40deg)}
    22%{opacity:.7;transform:rotate(-50deg)}
    33%{opacity:1;transform:rotate(-45deg)}
    44%{opacity:.7;transform:rotate(-55deg)}
    55%{opacity:1;transform:rotate(-50deg)}
    66%{opacity:.7;transform:rotate(-45deg)}
    77%{opacity:1;transform:rotate(-50deg)}
    88%{opacity:.7;transform:rotate(-45deg)}
    100%{opacity:.7;transform:rotate(-55deg)}}
  /* les quatre arcs, aux memes largeurs relatives que le composant */
  .arc{position:absolute;left:50%;transform:translateX(-50%);height:200%;
       border-top:1px dashed rgb(64 64 64 / .8);border-radius:9999px}
  .arc.a1{top:9%;width:130%}
  .arc.a2{top:22%;width:110%}
  .arc.a3{top:35%;width:96%}
  .arc.a4{top:48%;width:76%}
  .grille{position:absolute;left:0;top:0;width:100%;height:100%;
          pointer-events:none;
          animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .cible{position:absolute;width:9px;height:9px;border-radius:1px;
    background:#ef4444;border-top:1px solid #f87171;
    box-shadow:0 0 14px 5px rgba(239,68,68,.9);
    transition:top .9s cubic-bezier(.22,1.2,.36,1),
               left .9s cubic-bezier(.22,1.2,.36,1)}
  .cible .onde,.cible .battement{position:absolute;left:-9px;top:-9px;
    width:300%;height:300%;border-radius:9999px;border:1px solid #ef4444}
  .cible .onde{animation:onde 1.2s ease-out 1.3s both}
  .cible .battement{transform:scale(1.3);
    box-shadow:0 0 24px 5px rgba(239,68,68,.6);
    animation:battement 1s ease-in-out 1.3s both}
  @keyframes onde{from{transform:scale(1);opacity:.7}
                  50%{opacity:1}
                  to{transform:scale(1.7);opacity:0}}
  @keyframes battement{0%,100%{transform:scale(1.3)}
                       50%{transform:scale(1.56)}}
  /* Le disque du composant est `bg-black` : opaque, il faisait une tache
     sombre au milieu du decor maintenant que la carte a disparu. Il ne garde
     que son contour, le fond passe au travers. */
  .socle{position:absolute;bottom:-7rem;left:50%;transform:translateX(-50%);
         width:15rem;height:15rem;border-radius:9999px;
         border:1px solid #262626;background:transparent}
  /* le decor est clair par endroits : un voile calme le cote texte */
  #voile{position:absolute;inset:0;z-index:0;
         background:linear-gradient(100deg,rgb(0 0 0 / .9) 0%,
           rgb(0 0 0 / .74) 40%,rgb(0 0 0 / .4) 68%,rgb(0 0 0 / .25) 100%)}
  #rideau{position:fixed;inset:0;z-index:20;background:#000;
          pointer-events:none;opacity:0}

  #ether{position:fixed;inset:0;z-index:0;overflow:hidden;background:#000}
  #ether .fluide{position:absolute;inset:-100px;
                 filter:url(#ether-filtre) blur(4px)}
  /* Le composant pose un gris neutre 128. On garde exactement sa clarte mais
     on le teinte avec les couleurs relevees dans l'animation des cartes :
     echantillonnage des cinq fonds, teintes dominantes a 187 et 195 degres
     (turquoise), 210 a 225 (indigo), et un accent chaud vers 0.
     Le degrade remplace l'aplat, le masque et le filtre ne changent pas. */
  #ether .teinte{width:100%;height:100%;background-color:rgba(128,128,128,1);
                 background-image:linear-gradient(135deg,
                   #3d8a93 0%, #3f6f9b 32%, #4a5893 58%, #6d4a58 82%,
                   #8a4a44 100%);
                 -webkit-mask-image:url('../ether/mask.png');
                 mask-image:url('../ether/mask.png');
                 -webkit-mask-size:cover;mask-size:cover;
                 -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
                 -webkit-mask-position:center;mask-position:center}
  #ether .grain{position:absolute;inset:0;
                background-image:url('../ether/noise.png');
                background-size:240px;background-repeat:repeat;opacity:.5}
</style></head><body>
<div id="ether">
  <div class="fluide">
    <svg style="position:absolute" aria-hidden="true"><defs>
      <filter id="ether-filtre">
        <feTurbulence result="undulation" numOctaves="2"
                      baseFrequency="0.0005,0.002" seed="0" type="turbulence"/>
        <feColorMatrix in="undulation" type="hueRotate" values="180">
          <animate attributeName="values" from="0" to="360" dur="5.84s"
                   repeatCount="indefinite"/>
        </feColorMatrix>
        <feColorMatrix in="dist" result="circulation" type="matrix"
          values="4 0 0 0 1  4 0 0 0 1  4 0 0 0 1  1 0 0 0 0"/>
        <feDisplacementMap in="SourceGraphic" in2="circulation" scale="100"
                           result="dist"/>
        <feDisplacementMap in="dist" in2="undulation" scale="100"
                           result="output"/>
      </filter>
    </defs></svg>
    <div class="teinte"></div>
  </div>
  <div class="grain"></div>
</div>
<div id="voile"></div>
<div id="radar">
  <div class="haut">
    <div class="faisceau"></div>
    <div class="arc a1"></div><div class="arc a2"></div>
    <div class="arc a3"></div><div class="arc a4"></div>
    <svg class="grille" width="100%" height="100%"><rect x="22%" y="28%" width="6" height="6" rx="1" ry="1" fill="#404040"/><rect x="34%" y="56%" width="6" height="6" rx="1" ry="1" fill="#404040"/><rect x="68%" y="42%" width="6" height="6" rx="1" ry="1" fill="#404040"/><rect x="55%" y="70%" width="6" height="6" rx="1" ry="1" fill="#404040"/><rect x="40%" y="35%" width="6" height="6" rx="1" ry="1" fill="#404040"/><rect x="12%" y="57%" width="6" height="6" rx="1" ry="1" fill="#404040"/><rect x="26%" y="82%" width="6" height="6" rx="1" ry="1" fill="#404040"/><rect x="78%" y="62%" width="6" height="6" rx="1" ry="1" fill="#404040"/><rect x="66%" y="18%" width="6" height="6" rx="1" ry="1" fill="#404040"/></svg>
    <div class="cible"><div class="onde"></div><div class="battement"></div></div>
    <div class="socle"></div>
  </div>
</div>
<div id="scene">
  <div class="inner">
    <div class="eyebrow">LA SOLUTION</div>
    <p class="txt" id="p"></p>
    <p class="sous">Vous confiez une cible. Il explore, trouve les failles, les prouve, et livre un rapport clair.</p>
    <div class="piliers"><div class="pilier"><div class="n">1</div><div class="t">En continu</div><div class="d">À chaque évolution, pas une fois par an.</div></div><div class="pilier"><div class="n">2</div><div class="t">Avec preuves</div><div class="d">Chaque faille est démontrée, pas signalée.</div></div><div class="pilier"><div class="n">3</div><div class="t">Sous contrôle</div><div class="d">Vos données restent chez vous.</div></div></div>
  </div>
</div>
<div class="pied"><span>DARKMOON · ASC-IT</span><span>06 / 14</span></div>

<script>
// ── Le texte, moteur de la slide 2, repris tel quel ──────────────────────
const NOIR = '0 0 10px rgba(0,0,0,1), 0 0 22px rgba(0,0,0,1), '
           + '0 0 44px rgba(0,0,0,.98), 0 8px 46px rgba(0,0,0,.95), '
           + '0 0 110px rgba(0,0,0,.9)';
const MOTS = [{"t": "Darkmoon", "d": 2.5, "r": -0.009, "b": 14, "s": 0.9}, {"t": "teste", "d": 2.487, "r": 0.149, "b": 12, "s": 0.91}, {"t": "vos", "d": 2.448, "r": 0.264, "b": 13, "s": 0.919}, {"t": "systèmes", "d": 2.386, "r": 0.401, "b": 12, "s": 0.928}, {"t": "en", "d": 2.309, "r": 0.548, "b": 15, "s": 0.936}, {"t": "continu,", "d": 2.221, "r": 0.62, "b": 18, "s": 0.942}, {"t": "tout", "d": 2.132, "r": 0.753, "b": 15, "s": 0.947}, {"t": "seul.", "d": 2.049, "r": 0.849, "b": 18, "s": 0.949}];
const pTexte = document.getElementById('p');
MOTS.forEach(w => {
  const e = document.createElement('span');
  e.className = 'm';
  e.textContent = w.t;
  e.style.transitionDuration = w.d + 's';
  e.style.transitionDelay = w.r + 's';
  pTexte.appendChild(e);
});
const spans = [...pTexte.children];
function repos() {
  spans.forEach((e, i) => {
    e.classList.remove('pose');
    const w = MOTS[i];
    e.style.opacity = 0;
    e.style.filter = 'blur(' + w.b + 'px) brightness(.6)';
    e.style.transform = 'translateY(20px) scale(' + w.s + ') rotateX(-15deg)';
    e.style.textShadow = '0 0 40px rgba(255,255,255,.4), ' + NOIR;
  });
}
function jouerTexte() {
  repos();
  requestAnimationFrame(() => setTimeout(() => {
    spans.forEach(e => {
      e.style.opacity = 1;
      e.style.filter = 'blur(0px) brightness(1)';
      e.style.transform = 'translateY(0) scale(1) rotateX(0deg)';
      e.style.textShadow = '0 2px 8px rgba(255,255,255,.1), ' + NOIR;
    });
  }, 200));
  const fin = Math.max(...MOTS.map(w => w.r + w.d));
  setTimeout(() => spans.forEach(e => {
    e.style.filter = '';
    e.style.transform = '';
    e.classList.add('pose');
  }), (fin + 0.3) * 1000);
  setTimeout(jouerTexte, (fin + 1) * 1000 + 4000);
}
jouerTexte();

// ── Le point rouge saute d'un point a l'autre toutes les 3 secondes ──────
// Le composant s'appuie sur un ressort framer-motion, `stiffness 300,
// damping 70` : une courbe de Bezier legerement elastique en rend l'allure
// sans embarquer la bibliotheque.
const POINTS = [[28, 22], [56, 34], [42, 68], [70, 55], [35, 40], [57, 12], [82, 26], [62, 78], [18, 66]];
const cible = document.querySelector('.cible');
let k = 0;
function viser() {
  const [top, left] = POINTS[k];
  cible.style.top = top + '%';
  cible.style.left = left + '%';
  // les deux anneaux sont rejoues a chaque saut, comme la cle React du
  // composant qui change avec l'index
  cible.querySelectorAll('.onde,.battement').forEach(e => {
    const a = e.style.animation;
    e.style.animation = 'none'; void e.offsetWidth; e.style.animation = a || '';
  });
  k = (k + 1) % POINTS.length;
}
viser();
setInterval(viser, 3000);

// ── Ouverture : rideau noir, flou qui se leve ────────────────────────────
const rideau = document.createElement('div');
rideau.id = 'rideau';
document.body.appendChild(rideau);
const decor = document.getElementById('ether');
const radar = document.getElementById('radar');
const blocs = [...document.querySelectorAll('#scene .inner > *')];
const COURBE = 'cubic-bezier(.22,.61,.36,1)';
let animations = [], derniereOuverture = 0;

function ouvrir() {
  derniereOuverture = performance.now();
  animations.forEach(a => a.cancel());
  animations = [
    rideau.animate([{ opacity: 1 }, { opacity: 0 }],
      { duration: 2200, easing: COURBE, fill: 'backwards' }),
    decor.animate([{ opacity: 0 }, { opacity: 1 }],
      { duration: 2600, easing: COURBE, fill: 'backwards' }),
    radar.animate([
      { opacity: 0, filter: 'blur(24px)', transform: 'scale(.94)' },
      { opacity: 1, filter: 'blur(0px)', transform: 'none' }],
      { duration: 2200, delay: 300, easing: COURBE, fill: 'backwards' }),
    ...blocs.map((e, i) => e.animate([
      { opacity: 0, transform: 'translateY(16px)', filter: 'blur(12px)' },
      { opacity: 1, transform: 'none', filter: 'blur(0px)' }],
      { duration: 1600, delay: 380 + i * 160, easing: COURBE,
        fill: 'backwards' }))
  ];
  jouerTexte();
}
ouvrir();

// Rejouer a chaque retour sur la slide : le lecteur ne masque pas les slides
// voisines, il les translate hors du cadre, donc nos rAF sont brides et non
// geles. Le signal fiable est la reprise d'une cadence pleine.
let precedent = performance.now(), reprise = false, rapides = 0;
(function veille() {
  const t = performance.now(), dt = t - precedent;
  precedent = t;
  if (dt > 400) { reprise = true; rapides = 0; }
  else if (reprise) {
    rapides = dt < 40 ? rapides + 1 : 0;
    if (rapides >= 6) {
      reprise = false; rapides = 0;
      if (t - derniereOuverture > 2500) ouvrir();
    }
  }
  requestAnimationFrame(veille);
})();
</script>

</body></html>
