<!doctype html><html lang="fr"><head><meta charset="utf-8">
<title>Darkmoon, la solution</title>
<style>
  /* Les couleurs d'origine du composant, sans transposition : le balayage
     en `rgba(255,255,255,.3)`, les couronnes en `rgb(64 64 64 / .8)`, les
     carres en `#404040`. */
  :root{--faisceau:rgba(255,255,255,.18);
        --trait:rgb(64 64 64 / .8);
        --point:#404040}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;
            font-family:'Avenir Next',Avenir,ui-sans-serif,system-ui,sans-serif;
            -webkit-font-smoothing:antialiased}
  *{box-sizing:border-box}

  /* ── Le texte : registre magazine, police de la slide 2 ──────────────
     Meme famille, meme graisse, meme interlettrage et meme apparition mot a
     mot que la slide 2. Ce qui change est la mise en page : un chapo en
     petites capitales, une attaque en grand, puis des paragraphes courts,
     sans puce et sans tiret, chacun se suffisant a lui-meme. */
  #scene{position:absolute;inset:0;z-index:3;display:flex;align-items:center;
         justify-content:center;padding:0 96px;pointer-events:none}
  .inner{position:relative;width:62rem;max-width:62rem;text-align:center;
         pointer-events:auto}
  /* Plus de bloc derriere le texte : son degre radial etait borne par une
     boite, et cette boite se voyait comme un rectangle a faible opacite. La
     lisibilite est portee par les mots eux-memes, avec la pile d'ombres de
     la slide 2 — cinq couches, parce qu'une ombre CSS ne depasse pas
     l'opacite 1 et que c'est en les superposant qu'on obtient un noir dense
     autour des lettres. */
  .par{margin:0;color:#fff;font-weight:300;
       font-family:'Avenir Next','Avenir',system-ui,sans-serif;
       perspective:900px}
  /* une fois la sequence finie, le paragraphe sort de la scene 3D */
  .par.fini{perspective:none}
  .par.corps{font-size:1.66rem;line-height:1.62;letter-spacing:.016em;
             color:#fff;margin:0;max-width:none}
  /* Les trois mots-cles en neon, dans la couleur du fond : la scene bloim
     tourne autour de 230 a 250 degres, un indigo violace, releve sur son
     image de presentation. Le mot reste peu lumineux, c'est le halo qui
     porte, comme sur un vrai tube. */
  .m.cle{color:#9bb8ff;
         text-shadow:0 0 6px rgb(107 156 255 / .95),
                     0 0 18px rgb(77 126 255 / .7),
                     0 0 42px rgb(60 104 220 / .45),
                     0 0 10px rgba(0,0,0,1), 0 0 26px rgba(0,0,0,.95)}
  .m{display:inline-block;margin-right:.32em;
     transition-property:opacity,filter,transform,text-shadow;
     transition-timing-function:cubic-bezier(.25,.46,.45,.94);
     will-change:filter,transform,opacity;transform-style:preserve-3d;
     backface-visibility:hidden}
  .m.pose{will-change:auto;transform-style:flat;backface-visibility:visible}
  .pied{position:absolute;left:96px;right:96px;bottom:26px;display:flex;
        justify-content:space-between;font-size:11px;letter-spacing:.16em;
        text-transform:uppercase;color:rgb(255 255 255 / .38);z-index:4}
  /* Le pied porte les deux logos et plus de texte : Darkmoon avec son mot,
     puis le logotype ASC-IT, separes par un filet. */
  .pied .marque{display:flex;align-items:center;gap:12px}
  .pied .lg-dm{height:17px;width:auto;display:block;opacity:.9}
  .pied .lg-asc{height:12px;width:auto;display:block;opacity:.62}
  .pied .tiret{width:1px;height:12px;background:rgb(255 255 255 / .22);
               display:block}
  #rideau{position:fixed;inset:0;z-index:20;background:#000;
          pointer-events:none;opacity:0}

  /* ── Le texte : registre magazine, police de la slide 2 ──────────────
     Meme famille, meme graisse, meme interlettrage et meme apparition mot a
     mot que la slide 2. Ce qui change est la mise en page : un chapo en
     petites capitales, une attaque en grand, puis des paragraphes courts,
     sans puce et sans tiret, chacun se suffisant a lui-meme. */
  #scene{position:absolute;inset:0;z-index:3;display:flex;align-items:center;
         justify-content:center;padding:0 96px;pointer-events:none}
  .inner{position:relative;width:62rem;max-width:62rem;text-align:center;
         pointer-events:auto}
  /* Plus de bloc derriere le texte : son degre radial etait borne par une
     boite, et cette boite se voyait comme un rectangle a faible opacite. La
     lisibilite est portee par les mots eux-memes, avec la pile d'ombres de
     la slide 2 — cinq couches, parce qu'une ombre CSS ne depasse pas
     l'opacite 1 et que c'est en les superposant qu'on obtient un noir dense
     autour des lettres. */
  .par{margin:0;color:#fff;font-weight:300;
       font-family:'Avenir Next','Avenir',system-ui,sans-serif;
       perspective:900px}
  /* une fois la sequence finie, le paragraphe sort de la scene 3D */
  .par.fini{perspective:none}
  .par.corps{font-size:1.66rem;line-height:1.62;letter-spacing:.016em;
             color:#fff;margin:0;max-width:none}
  /* Les trois mots-cles en neon, dans la couleur du fond : la scene bloim
     tourne autour de 230 a 250 degres, un indigo violace, releve sur son
     image de presentation. Le mot reste peu lumineux, c'est le halo qui
     porte, comme sur un vrai tube. */
  .m.cle{color:#9bb8ff;
         text-shadow:0 0 6px rgb(107 156 255 / .95),
                     0 0 18px rgb(77 126 255 / .7),
                     0 0 42px rgb(60 104 220 / .45),
                     0 0 10px rgba(0,0,0,1), 0 0 26px rgba(0,0,0,.95)}
  .m{display:inline-block;margin-right:.32em;
     transition-property:opacity,filter,transform,text-shadow;
     transition-timing-function:cubic-bezier(.25,.46,.45,.94);
     will-change:filter,transform,opacity;transform-style:preserve-3d;
     backface-visibility:hidden}
  .m.pose{will-change:auto;transform-style:flat;backface-visibility:visible}
  .pied{position:absolute;left:96px;right:96px;bottom:26px;display:flex;
        justify-content:space-between;font-size:11px;letter-spacing:.16em;
        text-transform:uppercase;color:rgb(255 255 255 / .38);z-index:4}
  #rideau{position:fixed;inset:0;z-index:20;background:#000;
          pointer-events:none;opacity:0}

  /* ── Le fond : composant `bloim-animation-background` ─────────────────
     Le composant de @serjobas n'est ni du CSS ni un canvas maison : c'est
     une scene Unicorn Studio, `projectId 9tVO0xGS8DIar1DF4Sqc`, rendue par
     `unicornstudio.js` en 1.4.29, exactement comme dans son bundle. Elle est
     donc appelee telle quelle, sans reecriture.
     Un fond de secours en degrade est pose dessous : si le contexte WebGL
     manque, la slide reste tenue au lieu d'etre vide. */
  /* Le bloim est pose SUR le decor etheral des autres slides. Sa scene
     rend un fond noir opaque : en `screen`, ce noir devient neutre et seule
     sa lumiere reste, donc les deux se superposent au lieu de s'effacer.
     Le canvas est force a couvrir toute la boite : c'est son bord, quand il
     tombe court d'un pixel, qui tracait la ligne droite a faible opacite. */
  /* La scene bloim tourne autour de 240 degres, un indigo violace ; le
     decor etheral, lui, a ete releve a 211. Un `hue-rotate` de -28 degres
     amene l'une sur l'autre, et la saturation est a peine baissee pour que
     le violet ne domine plus. */
  #bloim{position:fixed;inset:0;z-index:1;overflow:hidden;
         mix-blend-mode:screen;filter:hue-rotate(-28deg) saturate(.92)}
  #bloim canvas,#bloim>div{width:100%!important;height:100%!important;
                           display:block}
  /* Le secours ne peint plus de noir : il ne fait que deux lueurs, pour que
     la slide tienne si le WebGL manque, sans masquer le decor etheral. */
  #secours{position:fixed;inset:0;z-index:0;pointer-events:none;background:
    radial-gradient(60% 52% at 50% 46%, rgb(64 54 190 / .3) 0%,
      rgb(0 0 0 / 0) 62%),
    radial-gradient(40% 34% at 50% 46%, rgb(150 140 255 / .22) 0%,
      rgb(0 0 0 / 0) 60%)}

  #rideau{position:fixed;inset:0;z-index:20;background:#000;
          pointer-events:none;opacity:0}

  #ether{position:fixed;inset:0;z-index:0;overflow:hidden;background:#000}
  #ether .fluide{position:absolute;inset:0;
                 background-image:url('../ether/silk.webp?r=2');
                 background-size:cover;background-position:center;
                 background-repeat:no-repeat}
  #ether .grain{position:absolute;inset:0;
                background-image:url('../ether/noise.png');
                background-size:240px;background-repeat:repeat;opacity:.5}
</style></head><body>
<div id="ether">
  <div class="fluide"></div>
  <div class="grain"></div>
</div>
<div id="scene">
  <div class="inner" id="texte"><p class="par corps"></p></div>
</div>
<div class="pied"><span class="marque"><img class="lg-dm" src="../logo-horizontal-alice.svg" alt="Darkmoon"><span class="tiret"></span><img class="lg-asc" src="../asc-it-logomark-blanc.svg" alt="ASC-IT"></span><span>05 / 12</span></div>

<script>
// ── Le texte, moteur de la slide 2, repris tel quel ──────────────────────
const NOIR = '0 0 10px rgba(0,0,0,1), 0 0 22px rgba(0,0,0,1), '
           + '0 0 44px rgba(0,0,0,.98), 0 8px 46px rgba(0,0,0,.95), '
           + '0 0 110px rgba(0,0,0,.9)';
const MOTS = [{"t": "La", "z": 0, "c": false, "d": 0.7, "r": -0.009, "b": 14, "s": 0.9}, {"t": "solution", "z": 0, "c": false, "d": 0.696, "r": 0.021, "b": 12, "s": 0.91}, {"t": ":", "z": 0, "c": false, "d": 0.683, "r": 0.03, "b": 13, "s": 0.919}, {"t": "Darkmoon", "z": 0, "c": false, "d": 0.662, "r": 0.069, "b": 12, "s": 0.928}, {"t": "teste", "z": 0, "c": false, "d": 0.636, "r": 0.12, "b": 15, "s": 0.936}, {"t": "vos", "z": 0, "c": false, "d": 0.607, "r": 0.1, "b": 18, "s": 0.942}, {"t": "systèmes", "z": 0, "c": false, "d": 0.577, "r": 0.143, "b": 15, "s": 0.947}, {"t": "en", "z": 0, "c": false, "d": 0.55, "r": 0.15, "b": 18, "s": 0.949}, {"t": "continu,", "z": 0, "c": false, "d": 0.526, "r": 0.172, "b": 13, "s": 0.95}, {"t": "tout", "z": 0, "c": false, "d": 0.51, "r": 0.24, "b": 12, "s": 0.949}, {"t": "seul.", "z": 0, "c": false, "d": 0.501, "r": 0.245, "b": 18, "s": 0.945}, {"t": "Vous", "z": 0, "c": false, "d": 0.501, "r": 0.242, "b": 15, "s": 0.94}, {"t": "confiez", "z": 0, "c": false, "d": 0.51, "r": 0.265, "b": 14, "s": 0.934}, {"t": "une", "z": 0, "c": false, "d": 0.527, "r": 0.3, "b": 14, "s": 0.926}, {"t": "cible.", "z": 0, "c": false, "d": 0.551, "r": 0.336, "b": 16, "s": 0.917}, {"t": "Il", "z": 0, "c": false, "d": 0.579, "r": 0.36, "b": 14, "s": 0.907}, {"t": "explore,", "z": 0, "c": false, "d": 0.609, "r": 0.36, "b": 15, "s": 0.897}, {"t": "trouve", "z": 0, "c": false, "d": 0.638, "r": 0.396, "b": 13, "s": 0.887}, {"t": "les", "z": 0, "c": false, "d": 0.663, "r": 0.429, "b": 15, "s": 0.878}, {"t": "failles,", "z": 0, "c": false, "d": 0.683, "r": 0.448, "b": 18, "s": 0.869}, {"t": "les", "z": 0, "c": false, "d": 0.696, "r": 0.485, "b": 19, "s": 0.862}, {"t": "prouve,", "z": 0, "c": false, "d": 0.7, "r": 0.498, "b": 19, "s": 0.856}, {"t": "et", "z": 0, "c": false, "d": 0.695, "r": 0.51, "b": 15, "s": 0.852}, {"t": "livre", "z": 0, "c": false, "d": 0.682, "r": 0.554, "b": 15, "s": 0.85}, {"t": "un", "z": 0, "c": false, "d": 0.661, "r": 0.542, "b": 16, "s": 0.85}, {"t": "rapport", "z": 0, "c": false, "d": 0.635, "r": 0.586, "b": 17, "s": 0.852}, {"t": "clair.", "z": 0, "c": false, "d": 0.605, "r": 0.619, "b": 16, "s": 0.856}, {"t": "En", "z": 0, "c": true, "d": 0.576, "r": 0.636, "b": 13, "s": 0.861}, {"t": "continu", "z": 0, "c": true, "d": 0.548, "r": 0.634, "b": 18, "s": 0.868}, {"t": ":", "z": 0, "c": false, "d": 0.525, "r": 0.659, "b": 17, "s": 0.877}, {"t": "à", "z": 0, "c": false, "d": 0.509, "r": 0.681, "b": 19, "s": 0.886}, {"t": "chaque", "z": 0, "c": false, "d": 0.501, "r": 0.717, "b": 13, "s": 0.896}, {"t": "évolution,", "z": 0, "c": false, "d": 0.502, "r": 0.757, "b": 17, "s": 0.906}, {"t": "pas", "z": 0, "c": false, "d": 0.511, "r": 0.758, "b": 17, "s": 0.916}, {"t": "une", "z": 0, "c": false, "d": 0.529, "r": 0.794, "b": 19, "s": 0.925}, {"t": "fois", "z": 0, "c": false, "d": 0.552, "r": 0.79, "b": 13, "s": 0.933}, {"t": "par", "z": 0, "c": false, "d": 0.581, "r": 0.856, "b": 19, "s": 0.94}, {"t": "an.", "z": 0, "c": false, "d": 0.61, "r": 0.866, "b": 13, "s": 0.945}, {"t": "Avec", "z": 0, "c": true, "d": 0.639, "r": 0.857, "b": 16, "s": 0.948}, {"t": "preuves", "z": 0, "c": true, "d": 0.665, "r": 0.909, "b": 19, "s": 0.95}, {"t": ":", "z": 0, "c": false, "d": 0.684, "r": 0.913, "b": 18, "s": 0.949}, {"t": "chaque", "z": 0, "c": false, "d": 0.696, "r": 0.966, "b": 17, "s": 0.947}, {"t": "faille", "z": 0, "c": false, "d": 0.7, "r": 0.945, "b": 19, "s": 0.943}, {"t": "est", "z": 0, "c": false, "d": 0.694, "r": 0.984, "b": 13, "s": 0.937}, {"t": "démontrée,", "z": 0, "c": false, "d": 0.681, "r": 1.014, "b": 15, "s": 0.929}, {"t": "pas", "z": 0, "c": false, "d": 0.659, "r": 1.05, "b": 14, "s": 0.921}, {"t": "signalée.", "z": 0, "c": false, "d": 0.633, "r": 1.071, "b": 18, "s": 0.911}, {"t": "Sous", "z": 0, "c": true, "d": 0.604, "r": 1.076, "b": 19, "s": 0.901}, {"t": "contrôle", "z": 0, "c": true, "d": 0.574, "r": 1.083, "b": 19, "s": 0.891}, {"t": ":", "z": 0, "c": false, "d": 0.547, "r": 1.121, "b": 16, "s": 0.882}, {"t": "vos", "z": 0, "c": false, "d": 0.524, "r": 1.167, "b": 18, "s": 0.873}, {"t": "données", "z": 0, "c": false, "d": 0.508, "r": 1.189, "b": 16, "s": 0.865}, {"t": "restent", "z": 0, "c": false, "d": 0.501, "r": 1.203, "b": 17, "s": 0.859}, {"t": "chez", "z": 0, "c": false, "d": 0.502, "r": 1.224, "b": 18, "s": 0.854}, {"t": "vous.", "z": 0, "c": false, "d": 0.512, "r": 1.261, "b": 14, "s": 0.851}];
// Le texte est en plusieurs paragraphes : chaque mot va dans le sien, et
// l'apparition suit l'ordre de lecture, du chapo a la derniere ligne.
const zones = [...document.querySelectorAll('#texte .par')];
MOTS.forEach(w => {
  const e = document.createElement('span');
  e.className = w.c ? 'm cle' : 'm';
  e.textContent = w.t;
  e.style.transitionDuration = w.d + 's';
  e.style.transitionDelay = w.r + 's';
  zones[w.z].appendChild(e);
});
const spans = zones.flatMap(z => [...z.children]);
function repos() {
  spans.forEach((e, i) => {
    e.classList.remove('pose');
    const w = MOTS[i];
    e.style.opacity = 0;
    e.style.filter = 'blur(' + w.b + 'px) brightness(.6)';
    e.style.transform = 'translateY(20px) scale(' + w.s + ') rotateX(-15deg)';
    e.style.textShadow = '0 0 40px rgba(255,255,255,.4), ' + NOIR;
  });
}
function jouerTexte() {
  repos();
  requestAnimationFrame(() => setTimeout(() => {
    spans.forEach(e => {
      e.style.opacity = 1;
      e.style.filter = 'blur(0px) brightness(1)';
      e.style.transform = 'translateY(0) scale(1) rotateX(0deg)';
      e.style.textShadow = '0 2px 8px rgba(255,255,255,.1), ' + NOIR;
    });
  }, 200));
  const fin = Math.max(...MOTS.map(w => w.r + w.d));
  // A la pose, on retire TOUT ce qui maintient un calque composite : un
  // `blur(0px)`, un `will-change` ou une scene 3D suffisent a faire
  // rasteriser le mot a sa taille puis a le remettre a l'echelle, et c'est
  // ce qui ramollissait le texte.
  setTimeout(() => spans.forEach(e => {
    e.style.filter = '';
    e.style.transform = '';
    e.style.willChange = 'auto';
    e.classList.add('pose');
    e.parentElement.classList.add('fini');
    // l'ombre reste apres la pose : c'est elle qui tient la lisibilite sur
    // un fond anime, maintenant qu'il n'y a plus de bloc derriere
    e.style.textShadow = '0 2px 8px rgba(255,255,255,.08), ' + NOIR;
  }), (fin + 0.3) * 1000);
  // Pas de rejeu en boucle : avec cinquante-cinq mots, le cycle repartait
  // toutes les douze secondes et le texte passait le plus clair de son temps
  // dans le flou. Il ne se rejoue qu'au retour sur la slide, via `ouvrir`.
}
jouerTexte();

// ── Ouverture : rideau noir, flou qui se leve ────────────────────────────
const rideau = document.createElement('div');
rideau.id = 'rideau';
document.body.appendChild(rideau);
// cette slide est sur fond noir : il n'y a pas de decor a faire monter
const decor = document.getElementById('ether');
const blocs = [...document.querySelectorAll('#scene .inner > *')];
const COURBE = 'cubic-bezier(.22,.61,.36,1)';
let animations = [], derniereOuverture = 0;

function ouvrir() {
  derniereOuverture = performance.now();
  animations.forEach(a => a.cancel());
  animations = [
    rideau.animate([{ opacity: 1 }, { opacity: 0 }],
      { duration: 800, easing: COURBE, fill: 'backwards' }),
    ...(decor ? [decor.animate([{ opacity: 0 }, { opacity: 1 }],
      { duration: 900, easing: COURBE, fill: 'backwards' })] : []),
    ...(decor ? [decor.animate([{ opacity: 0 }, { opacity: 1 }],
      { duration: 900, easing: COURBE, fill: 'backwards' })] : []),
    ...blocs.map((e, i) => e.animate([
      { opacity: 0, transform: 'translateY(16px)', filter: 'blur(12px)' },
      { opacity: 1, transform: 'none', filter: 'blur(0px)' }],
      { duration: 600, delay: 55 + i * 60, easing: COURBE,
        fill: 'backwards' }))
  ];
  jouerTexte();
}
ouvrir();

// Rejouer a chaque retour sur la slide : le lecteur ne masque pas les slides
// voisines, il les translate hors du cadre, donc nos rAF sont brides et non
// geles. Le signal fiable est la reprise d'une cadence pleine.
let precedent = performance.now(), reprise = false, rapides = 0;
(function veille() {
  const t = performance.now(), dt = t - precedent;
  precedent = t;
  if (dt > 400) { reprise = true; rapides = 0; }
  else if (reprise) {
    rapides = dt < 40 ? rapides + 1 : 0;
    if (rapides >= 6) {
      reprise = false; rapides = 0;
      if (t - derniereOuverture > 2500) ouvrir();
    }
  }
  requestAnimationFrame(veille);
})();
</script>

</body></html>
