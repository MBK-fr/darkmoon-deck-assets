<!doctype html><html lang="fr"><head><meta charset="utf-8">
<title>Darkmoon, la solution</title>
<style>
  /* Les couleurs d'origine du composant, sans transposition : le balayage
     en `rgba(255,255,255,.3)`, les couronnes en `rgb(64 64 64 / .8)`, les
     carres en `#404040`. */
  :root{--faisceau:rgba(255,255,255,.3);
        --trait:rgb(64 64 64 / .8);
        --point:#404040}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;
            font-family:'Avenir Next',Avenir,ui-sans-serif,system-ui,sans-serif;
            -webkit-font-smoothing:antialiased}
  *{box-sizing:border-box}

  /* ── Le texte va DANS les emplacements du composant ───────────────────
     Le demonstrateur pose un `h3` puis un `p` en bas a gauche de sa carte,
     `absolute bottom-5 left-0 w-full px-3`. C'est la que le texte de la
     slide 6 prend place : le titre du PPTX dans le `h3`, sa phrase dans le
     `p`. Meme emplacement, meme ordre ; seules la taille et la police
     changent, pour rester dans le registre de la slide 2. */
  #scene{position:absolute;inset:0;z-index:3;display:flex;
         align-items:center;padding:0 76px;pointer-events:none}
  .inner{position:relative;width:40rem;max-width:40rem;text-align:left;
         pointer-events:auto}
  .inner::before{content:"";position:absolute;inset:-40% -14% -60%;
                 z-index:-1;
                 background:radial-gradient(64% 60% at 30% 60%,
                   rgba(0,0,0,.86) 0%, rgba(0,0,0,.64) 42%,
                   rgba(0,0,0,.28) 70%, rgba(0,0,0,0) 100%)}
  /* Le pas typographique : chaque niveau a sa taille, sa graisse et son
     interlettrage, et l'ecart vertical suit la hierarchie plutot que d'etre
     constant. C'est ce qui manquait pour que le bloc se tienne. */
  .eyebrow{font-size:10.5px;letter-spacing:.46em;text-transform:uppercase;
           color:rgb(220 234 244 / .5);margin-bottom:26px;
           display:flex;align-items:center;gap:14px}
  .eyebrow::after{content:"";width:46px;height:1px;
    background:linear-gradient(to right,rgb(220 234 244 / .35),rgb(220 234 244 / 0))}
  .txt{color:#fff;font-size:1.62rem;line-height:1.62;letter-spacing:.014em;
       font-weight:300;margin:0;
       font-family:'Avenir Next','Avenir',system-ui,sans-serif;
       perspective:900px}
  .m{display:inline-block;margin-right:.35em;
     transition-property:opacity,filter,transform,text-shadow;
     transition-timing-function:cubic-bezier(.25,.46,.45,.94);
     will-change:filter,transform,opacity;transform-style:preserve-3d;
     backface-visibility:hidden}
  .m.pose{will-change:auto;transform-style:flat;backface-visibility:visible}
  /* Les trois piliers du PPTX, en colonnes separees par un filet, comme une
     table editoriale : le chiffre en exposant, le titre, la ligne. */
  .sous{margin:20px 0 0;font-size:17px;line-height:1.66;font-weight:300;
        color:rgb(255 255 255 / .7);max-width:52ch;letter-spacing:.004em}
  .piliers{margin-top:44px;display:grid;grid-template-columns:repeat(3,1fr);
           gap:0;max-width:47rem}
  .pilier{padding:2px 34px;border-left:1px solid rgb(220 234 244 / .12)}
  .pilier:first-child{padding-left:0;border-left:0}
  /* le chiffre est traite comme un folio : grand, clair, tres discret */
  .pilier .n{font-size:23px;font-weight:200;line-height:1;
             color:rgb(220 234 244 / .28);letter-spacing:.02em}
  .pilier .t{margin-top:12px;font-size:15px;color:#fff;font-weight:400;
             letter-spacing:.012em}
  .pilier .d{margin-top:8px;font-size:13.5px;line-height:1.68;
             color:rgb(255 255 255 / .58)}
  .pied{position:absolute;left:76px;right:76px;bottom:26px;display:flex;
        justify-content:space-between;font-size:11px;letter-spacing:.16em;
        text-transform:uppercase;color:rgb(255 255 255 / .38);z-index:4}

  /* ── Le radar, au milieu et en cercles complets ───────────────────────
     Plutot qu'une portion geante ancree au bas du cadre, la scene devient un
     radar entier, pose au centre droit de la slide : des couronnes fermees,
     un balayage qui fait le tour, la cible qui saute de point en point. Les
     valeurs du composant sont conservees, seules la composition et la course
     du balayage changent, puisqu'un cercle complet appelle un tour complet.
     Le trace est en SVG, dans une boite carree a taille fixe, donc les
     cercles restent ronds. */
  #radar{position:absolute;right:72px;top:50%;width:540px;height:540px;
         transform:translateY(-50%);z-index:2;pointer-events:none}
  #radar .champ,#radar .haut{position:absolute;inset:0}
  .faisceau{position:absolute;top:50%;left:50%;width:270px;height:270px;
    transform-origin:bottom left;pointer-events:none;
    background:radial-gradient(circle at 0% 100%,
      var(--faisceau) 5%, transparent 60%);
    animation:balayage 12s linear infinite}
  /* Un cercle complet appelle un tour complet : le balayage tourne sans
     rebrousser chemin, la ou le composant oscillait entre -55 et -40 degres
     parce qu'il ne montrait qu'un quart de disque. */
  @keyframes balayage{from{transform:rotate(0deg)}
                      to{transform:rotate(360deg)}}
  #trace{position:absolute;inset:0;width:540px;height:540px;overflow:visible}
  #trace circle{fill:none;stroke:var(--trait);stroke-width:1;
                stroke-dasharray:2 2}
  #trace circle.socle{stroke:#262626;stroke-dasharray:none}
  .grille{position:absolute;left:0;top:0;width:100%;height:100%;
          pointer-events:none;
          animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite}
  .grille rect{fill:var(--point)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  /* Neon : le point reste petit et sature, et c'est le halo qui porte, en
     trois portees. Deux teintes alternent, le rouge du composant et un
     orange plus chaud, pour qu'on distingue les cibles entre elles. */
  /* la cible, aux valeurs du composant */
  .cible{position:absolute;width:6.5px;height:6.5px;border-radius:1px;
    background:#ef4444;border-top:1px solid #f87171;
    transform:translate(-.5px,-.5px);
    box-shadow:0 0 10px 4px rgba(239,68,68,.9);
    transition:top .9s cubic-bezier(.22,1.2,.36,1),
               left .9s cubic-bezier(.22,1.2,.36,1)}
  .cible .onde,.cible .battement{position:absolute;left:-6px;top:-6px;
    width:270%;height:300%;border-radius:9999px;border:1px solid #ef4444}
  .cible .onde{animation:onde 1.2s ease-out 1.3s both}
  .cible .battement{transform:scale(1.3);
    box-shadow:0 0 20px 4px rgba(239,68,68,.6);
    animation:battement 1s ease-in-out 1.3s both}
  @keyframes onde{from{transform:scale(1);opacity:.7}
                  50%{opacity:1}
                  to{transform:scale(1.7);opacity:0}}
  @keyframes battement{0%,100%{transform:scale(1.3)}
                       50%{transform:scale(1.56)}}
  /* Le disque du composant est `bg-black` : opaque, il faisait une tache
     sombre au milieu du decor maintenant que la carte a disparu. Il ne garde
     que son contour, le fond passe au travers. */
  /* Fond noir, comme demande. Une vignette a peine marquee evite l'aplat
     parfaitement plat, qui sonne creux sur un ecran de projection. */
  /* Noir plein, sans vignette : le composant est sur `bg-black`, rien de
     plus, et la moindre nappe se voyait a la projection. */
  #voile{position:absolute;inset:0;z-index:0;background:#000}
  #rideau{position:fixed;inset:0;z-index:20;background:#000;
          pointer-events:none;opacity:0}
</style></head><body>
<div id="voile"></div>
<div id="radar">
  <div class="champ"><div class="haut">
    <div class="faisceau"></div>
    <svg id="trace" width="540" height="540" viewBox="0 0 540 540">
      <g transform="translate(270,270)"><circle r="264"/><circle r="236"/><circle r="208"/><circle r="180"/><circle r="152"/><circle r="124"/><circle r="96"/><circle r="68"/><circle class="socle" r="26"/></g>
    </svg>
    <svg class="grille" width="100%" height="100%"><rect x="321" y="95" width="5" height="5" rx="1" ry="1"/><rect x="281" y="200" width="5" height="5" rx="1" ry="1"/><rect x="394" y="181" width="5" height="5" rx="1" ry="1"/><rect x="334" y="200" width="5" height="5" rx="1" ry="1"/><rect x="59" y="164" width="5" height="5" rx="1" ry="1"/><rect x="211" y="308" width="5" height="5" rx="1" ry="1"/><rect x="283" y="143" width="5" height="5" rx="1" ry="1"/><rect x="383" y="325" width="5" height="5" rx="1" ry="1"/><rect x="531" y="273" width="5" height="5" rx="1" ry="1"/><rect x="284" y="334" width="5" height="5" rx="1" ry="1"/><rect x="239" y="393" width="5" height="5" rx="1" ry="1"/><rect x="203" y="133" width="5" height="5" rx="1" ry="1"/><rect x="417" y="241" width="5" height="5" rx="1" ry="1"/><rect x="392" y="174" width="5" height="5" rx="1" ry="1"/><rect x="118" y="360" width="5" height="5" rx="1" ry="1"/><rect x="210" y="376" width="5" height="5" rx="1" ry="1"/><rect x="252" y="204" width="5" height="5" rx="1" ry="1"/><rect x="309" y="184" width="5" height="5" rx="1" ry="1"/><rect x="376" y="514" width="5" height="5" rx="1" ry="1"/><rect x="519" y="363" width="5" height="5" rx="1" ry="1"/><rect x="225" y="326" width="5" height="5" rx="1" ry="1"/><rect x="325" y="44" width="5" height="5" rx="1" ry="1"/><rect x="382" y="96" width="5" height="5" rx="1" ry="1"/><rect x="379" y="506" width="5" height="5" rx="1" ry="1"/><rect x="274" y="419" width="5" height="5" rx="1" ry="1"/><rect x="109" y="478" width="5" height="5" rx="1" ry="1"/><rect x="412" y="384" width="5" height="5" rx="1" ry="1"/><rect x="475" y="318" width="5" height="5" rx="1" ry="1"/><rect x="177" y="262" width="5" height="5" rx="1" ry="1"/><rect x="157" y="448" width="5" height="5" rx="1" ry="1"/><rect x="231" y="356" width="5" height="5" rx="1" ry="1"/><rect x="182" y="180" width="5" height="5" rx="1" ry="1"/><rect x="367" y="426" width="5" height="5" rx="1" ry="1"/><rect x="218" y="232" width="5" height="5" rx="1" ry="1"/></svg>
    <div class="cible"><div class="onde"></div><div class="battement"></div></div>
  </div></div>
</div>
<div id="scene">
  <div class="inner">
    <p class="txt" id="p"></p>
  </div>
</div>
<div class="pied"><span>DARKMOON · ASC-IT</span><span>06 / 14</span></div>

<script>
// ── Le texte, moteur de la slide 2, repris tel quel ──────────────────────
const NOIR = '0 0 10px rgba(0,0,0,1), 0 0 22px rgba(0,0,0,1), '
           + '0 0 44px rgba(0,0,0,.98), 0 8px 46px rgba(0,0,0,.95), '
           + '0 0 110px rgba(0,0,0,.9)';
const MOTS = [{"t": "La", "d": 2.5, "r": -0.009, "b": 14, "s": 0.9}, {"t": "solution :", "d": 2.487, "r": 0.075, "b": 12, "s": 0.91}, {"t": "Darkmoon", "d": 2.448, "r": 0.134, "b": 13, "s": 0.919}, {"t": "teste", "d": 2.386, "r": 0.223, "b": 12, "s": 0.928}, {"t": "vos", "d": 2.309, "r": 0.323, "b": 15, "s": 0.936}, {"t": "systèmes", "d": 2.221, "r": 0.351, "b": 18, "s": 0.942}, {"t": "en", "d": 2.132, "r": 0.442, "b": 15, "s": 0.947}, {"t": "continu,", "d": 2.049, "r": 0.497, "b": 18, "s": 0.949}, {"t": "tout", "d": 1.979, "r": 0.566, "b": 13, "s": 0.95}, {"t": "seul.", "d": 1.929, "r": 0.682, "b": 12, "s": 0.949}, {"t": "Vous", "d": 1.903, "r": 0.734, "b": 18, "s": 0.945}, {"t": "confiez", "d": 1.904, "r": 0.777, "b": 15, "s": 0.94}, {"t": "une", "d": 1.931, "r": 0.847, "b": 14, "s": 0.934}, {"t": "cible.", "d": 1.982, "r": 0.93, "b": 14, "s": 0.926}, {"t": "Il", "d": 2.053, "r": 1.012, "b": 16, "s": 0.917}, {"t": "explore,", "d": 2.137, "r": 1.082, "b": 14, "s": 0.907}, {"t": "trouve", "d": 2.226, "r": 1.129, "b": 15, "s": 0.897}, {"t": "les", "d": 2.313, "r": 1.212, "b": 13, "s": 0.887}, {"t": "failles,", "d": 2.39, "r": 1.291, "b": 15, "s": 0.878}, {"t": "les", "d": 2.45, "r": 1.357, "b": 18, "s": 0.869}, {"t": "prouve,", "d": 2.488, "r": 1.44, "b": 19, "s": 0.862}, {"t": "et", "d": 2.5, "r": 1.499, "b": 19, "s": 0.856}, {"t": "livre", "d": 2.485, "r": 1.557, "b": 15, "s": 0.852}, {"t": "un", "d": 2.445, "r": 1.647, "b": 15, "s": 0.85}, {"t": "rapport", "d": 2.383, "r": 1.68, "b": 16, "s": 0.85}, {"t": "clair.", "d": 2.304, "r": 1.771, "b": 17, "s": 0.852}, {"t": "En", "d": 2.216, "r": 1.85, "b": 16, "s": 0.856}, {"t": "continu", "d": 2.127, "r": 1.913, "b": 13, "s": 0.861}, {"t": ":", "d": 2.044, "r": 1.957, "b": 18, "s": 0.868}, {"t": "à", "d": 1.975, "r": 2.027, "b": 17, "s": 0.877}, {"t": "chaque", "d": 1.927, "r": 2.095, "b": 19, "s": 0.886}, {"t": "évolution,", "d": 1.902, "r": 2.177, "b": 13, "s": 0.896}, {"t": "pas", "d": 1.905, "r": 2.262, "b": 17, "s": 0.906}, {"t": "une", "d": 1.933, "r": 2.309, "b": 17, "s": 0.916}, {"t": "fois", "d": 1.986, "r": 2.39, "b": 19, "s": 0.925}, {"t": "par", "d": 2.057, "r": 2.432, "b": 13, "s": 0.933}, {"t": "an.", "d": 2.142, "r": 2.544, "b": 19, "s": 0.94}, {"t": "Avec", "d": 2.231, "r": 2.599, "b": 13, "s": 0.945}, {"t": "preuves", "d": 2.318, "r": 2.636, "b": 16, "s": 0.948}, {"t": ":", "d": 2.394, "r": 2.733, "b": 19, "s": 0.95}, {"t": "chaque", "d": 2.453, "r": 2.783, "b": 18, "s": 0.949}, {"t": "faille", "d": 2.489, "r": 2.88, "b": 17, "s": 0.947}, {"t": "est", "d": 2.5, "r": 2.905, "b": 19, "s": 0.943}, {"t": "démontrée,", "d": 2.483, "r": 2.989, "b": 13, "s": 0.937}, {"t": "pas", "d": 2.442, "r": 3.064, "b": 15, "s": 0.929}, {"t": "signalée.", "d": 2.378, "r": 3.146, "b": 14, "s": 0.921}, {"t": "Sous", "d": 2.299, "r": 3.212, "b": 18, "s": 0.911}, {"t": "contrôle", "d": 2.211, "r": 3.262, "b": 19, "s": 0.901}, {"t": ":", "d": 2.122, "r": 3.314, "b": 19, "s": 0.891}, {"t": "vos", "d": 2.04, "r": 3.398, "b": 16, "s": 0.882}, {"t": "données", "d": 1.972, "r": 3.489, "b": 18, "s": 0.873}, {"t": "restent", "d": 1.925, "r": 3.556, "b": 16, "s": 0.865}, {"t": "chez", "d": 1.902, "r": 3.615, "b": 17, "s": 0.859}, {"t": "vous.", "d": 1.906, "r": 3.682, "b": 18, "s": 0.854}];
const pTexte = document.getElementById('p');
MOTS.forEach(w => {
  const e = document.createElement('span');
  e.className = 'm';
  e.textContent = w.t;
  e.style.transitionDuration = w.d + 's';
  e.style.transitionDelay = w.r + 's';
  pTexte.appendChild(e);
});
const spans = [...pTexte.children];
function repos() {
  spans.forEach((e, i) => {
    e.classList.remove('pose');
    const w = MOTS[i];
    e.style.opacity = 0;
    e.style.filter = 'blur(' + w.b + 'px) brightness(.6)';
    e.style.transform = 'translateY(20px) scale(' + w.s + ') rotateX(-15deg)';
    e.style.textShadow = '0 0 40px rgba(255,255,255,.4), ' + NOIR;
  });
}
function jouerTexte() {
  repos();
  requestAnimationFrame(() => setTimeout(() => {
    spans.forEach(e => {
      e.style.opacity = 1;
      e.style.filter = 'blur(0px) brightness(1)';
      e.style.transform = 'translateY(0) scale(1) rotateX(0deg)';
      e.style.textShadow = '0 2px 8px rgba(255,255,255,.1), ' + NOIR;
    });
  }, 200));
  const fin = Math.max(...MOTS.map(w => w.r + w.d));
  setTimeout(() => spans.forEach(e => {
    e.style.filter = '';
    e.style.transform = '';
    e.classList.add('pose');
  }), (fin + 0.3) * 1000);
  setTimeout(jouerTexte, (fin + 1) * 1000 + 4000);
}
jouerTexte();

// ── Le point rouge saute d'un point a l'autre toutes les 3 secondes ──────
// Le composant s'appuie sur un ressort framer-motion, `stiffness 300,
// damping 70` : une courbe de Bezier legerement elastique en rend l'allure
// sans embarquer la bibliotheque.
const POINTS = [[95, 321], [200, 281], [181, 394], [200, 334], [164, 59], [308, 211], [143, 283], [325, 383], [273, 531], [334, 284], [393, 239], [133, 203], [241, 417], [174, 392], [360, 118], [376, 210], [204, 252], [184, 309], [514, 376], [363, 519], [326, 225], [44, 325], [96, 382], [506, 379], [419, 274], [478, 109], [384, 412], [318, 475], [262, 177], [448, 157], [356, 231], [180, 182], [426, 367], [232, 218]];
// Trois cibles au lieu d'une, decalees d'un tiers du tour de liste et d'une
// seconde chacune : elles ne tombent jamais sur le meme point ni au meme
// instant.
// Une seule cible mouvante, comme le composant : ce sont les petits carres
// qui portent la couleur, pas des cibles supplementaires.
const cibles = [...document.querySelectorAll('.cible')];
cibles.forEach((cible, n) => {
  let k = 0;
  const viser = () => {
    const [top, left] = POINTS[k];
    cible.style.top = top + 'px';
    cible.style.left = left + 'px';
    // les anneaux sont rejoues a chaque saut, comme la cle React du
    // composant qui change avec l'index
    cible.querySelectorAll('.onde,.battement').forEach(e => {
      const a = e.style.animation;
      e.style.animation = 'none'; void e.offsetWidth;
      e.style.animation = a || '';
    });
    k = (k + 1) % POINTS.length;
  };
  viser();
  setTimeout(() => { viser(); setInterval(viser, 3000); }, n * 1000);
});

// ── Ouverture : rideau noir, flou qui se leve ────────────────────────────
const rideau = document.createElement('div');
rideau.id = 'rideau';
document.body.appendChild(rideau);
// cette slide est sur fond noir : il n'y a pas de decor a faire monter
const decor = document.getElementById('ether');
const radar = document.getElementById('radar');
const blocs = [...document.querySelectorAll('#scene .inner > *')];
const COURBE = 'cubic-bezier(.22,.61,.36,1)';
let animations = [], derniereOuverture = 0;

function ouvrir() {
  derniereOuverture = performance.now();
  animations.forEach(a => a.cancel());
  animations = [
    rideau.animate([{ opacity: 1 }, { opacity: 0 }],
      { duration: 2200, easing: COURBE, fill: 'backwards' }),
    ...(decor ? [decor.animate([{ opacity: 0 }, { opacity: 1 }],
      { duration: 2600, easing: COURBE, fill: 'backwards' })] : []),
    radar.animate([
      { opacity: 0, filter: 'blur(24px)', transform: 'scale(.94)' },
      { opacity: 1, filter: 'blur(0px)', transform: 'none' }],
      { duration: 2200, delay: 300, easing: COURBE, fill: 'backwards' }),
    ...blocs.map((e, i) => e.animate([
      { opacity: 0, transform: 'translateY(16px)', filter: 'blur(12px)' },
      { opacity: 1, transform: 'none', filter: 'blur(0px)' }],
      { duration: 1600, delay: 380 + i * 160, easing: COURBE,
        fill: 'backwards' }))
  ];
  jouerTexte();
}
ouvrir();

// Rejouer a chaque retour sur la slide : le lecteur ne masque pas les slides
// voisines, il les translate hors du cadre, donc nos rAF sont brides et non
// geles. Le signal fiable est la reprise d'une cadence pleine.
let precedent = performance.now(), reprise = false, rapides = 0;
(function veille() {
  const t = performance.now(), dt = t - precedent;
  precedent = t;
  if (dt > 400) { reprise = true; rapides = 0; }
  else if (reprise) {
    rapides = dt < 40 ? rapides + 1 : 0;
    if (rapides >= 6) {
      reprise = false; rapides = 0;
      if (t - derniereOuverture > 2500) ouvrir();
    }
  }
  requestAnimationFrame(veille);
})();
</script>
