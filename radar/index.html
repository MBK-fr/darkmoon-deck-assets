<!doctype html><html lang="fr"><head><meta charset="utf-8">
<title>Darkmoon, la solution</title>
<style>
  /* Les couleurs d'origine du composant, sans transposition : le balayage
     en `rgba(255,255,255,.3)`, les couronnes en `rgb(64 64 64 / .8)`, les
     carres en `#404040`. */
  :root{--faisceau:rgba(255,255,255,.18);
        --trait:rgb(64 64 64 / .8);
        --point:#404040}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;
            font-family:'Avenir Next',Avenir,ui-sans-serif,system-ui,sans-serif;
            -webkit-font-smoothing:antialiased}
  *{box-sizing:border-box}

  /* ── Le texte : registre magazine, police de la slide 2 ──────────────
     Meme famille, meme graisse, meme interlettrage et meme apparition mot a
     mot que la slide 2. Ce qui change est la mise en page : un chapo en
     petites capitales, une attaque en grand, puis des paragraphes courts,
     sans puce et sans tiret, chacun se suffisant a lui-meme. */
  #scene{position:absolute;inset:0;z-index:3;display:flex;align-items:center;
         padding:0 96px;pointer-events:none}
  .inner{position:relative;width:44rem;max-width:44rem;text-align:left;
         pointer-events:auto}
  .inner::before{content:"";position:absolute;inset:-28% -16%;z-index:-1;
                 background:radial-gradient(62% 58% at 34% 50%,
                   rgba(0,0,0,.82) 0%, rgba(0,0,0,.58) 44%,
                   rgba(0,0,0,.24) 72%, rgba(0,0,0,0) 100%)}
  .par{margin:0;color:#fff;font-weight:300;
       font-family:'Avenir Next','Avenir',system-ui,sans-serif;
       perspective:900px}
  .par.chapo{font-size:11px;letter-spacing:.42em;text-transform:uppercase;
             color:rgb(220 234 244 / .55);margin-bottom:22px}
  .par.attaque{font-size:2.35rem;line-height:1.24;letter-spacing:-.01em;
               margin-bottom:26px}
  .par.corps{font-size:1.12rem;line-height:1.72;letter-spacing:.012em;
             color:rgb(255 255 255 / .78);margin-bottom:14px;max-width:44ch}
  .par.corps:last-child{margin-bottom:0}
  .m{display:inline-block;margin-right:.32em;
     transition-property:opacity,filter,transform,text-shadow;
     transition-timing-function:cubic-bezier(.25,.46,.45,.94);
     will-change:filter,transform,opacity;transform-style:preserve-3d;
     backface-visibility:hidden}
  .m.pose{will-change:auto;transform-style:flat;backface-visibility:visible}
  .pied{position:absolute;left:96px;right:96px;bottom:26px;display:flex;
        justify-content:space-between;font-size:11px;letter-spacing:.16em;
        text-transform:uppercase;color:rgb(255 255 255 / .38);z-index:4}
  #rideau{position:fixed;inset:0;z-index:20;background:#000;
          pointer-events:none;opacity:0}

  /* ── Le fond : composant `bloim-animation-background` ─────────────────
     Le composant de @serjobas n'est ni du CSS ni un canvas maison : c'est
     une scene Unicorn Studio, `projectId 9tVO0xGS8DIar1DF4Sqc`, rendue par
     `unicornstudio.js` en 1.4.29, exactement comme dans son bundle. Elle est
     donc appelee telle quelle, sans reecriture.
     Un fond de secours en degrade est pose dessous : si le contexte WebGL
     manque, la slide reste tenue au lieu d'etre vide. */
  #bloim{position:fixed;inset:0;z-index:0}
  #secours{position:fixed;inset:0;z-index:-1;background:
    radial-gradient(120% 90% at 22% 18%, rgb(26 36 64 / .55) 0%,
      rgb(0 0 0 / 0) 60%),
    radial-gradient(90% 80% at 82% 82%, rgb(44 24 52 / .5) 0%,
      rgb(0 0 0 / 0) 62%), #000}

  #rideau{position:fixed;inset:0;z-index:20;background:#000;
          pointer-events:none;opacity:0}
</style></head><body>
<div id="secours"></div>
<div id="bloim" data-us-project="9tVO0xGS8DIar1DF4Sqc" data-us-scale="1"
     data-us-dpi="1.5" data-us-fps="60" data-us-production="1"></div>
<script src="https://cdn.jsdelivr.net/gh/hiunicornstudio/unicornstudio.js@v1.4.29/dist/unicornStudio.umd.js"></script>
<script>window.UnicornStudio && UnicornStudio.init();</script>
<div id="scene">
  <div class="inner" id="texte"><p class="par chapo"></p><p class="par attaque"></p><p class="par corps"></p><p class="par corps"></p><p class="par corps"></p><p class="par corps"></p></div>
</div>
<div class="pied"><span>DARKMOON · ASC-IT</span><span>06 / 14</span></div>

<script>
// ── Le texte, moteur de la slide 2, repris tel quel ──────────────────────
const NOIR = '0 0 10px rgba(0,0,0,1), 0 0 22px rgba(0,0,0,1), '
           + '0 0 44px rgba(0,0,0,.98), 0 8px 46px rgba(0,0,0,.95), '
           + '0 0 110px rgba(0,0,0,.9)';
const MOTS = [{"t": "La", "z": 0, "d": 2.5, "r": -0.009, "b": 14, "s": 0.9}, {"t": "solution", "z": 0, "d": 2.487, "r": 0.075, "b": 12, "s": 0.91}, {"t": "Darkmoon", "z": 1, "d": 2.448, "r": 0.134, "b": 13, "s": 0.919}, {"t": "teste", "z": 1, "d": 2.386, "r": 0.223, "b": 12, "s": 0.928}, {"t": "vos", "z": 1, "d": 2.309, "r": 0.323, "b": 15, "s": 0.936}, {"t": "systèmes", "z": 1, "d": 2.221, "r": 0.351, "b": 18, "s": 0.942}, {"t": "en", "z": 1, "d": 2.132, "r": 0.442, "b": 15, "s": 0.947}, {"t": "continu,", "z": 1, "d": 2.049, "r": 0.497, "b": 18, "s": 0.949}, {"t": "tout", "z": 1, "d": 1.979, "r": 0.566, "b": 13, "s": 0.95}, {"t": "seul.", "z": 1, "d": 1.929, "r": 0.682, "b": 12, "s": 0.949}, {"t": "Vous", "z": 2, "d": 1.903, "r": 0.734, "b": 18, "s": 0.945}, {"t": "confiez", "z": 2, "d": 1.904, "r": 0.777, "b": 15, "s": 0.94}, {"t": "une", "z": 2, "d": 1.931, "r": 0.847, "b": 14, "s": 0.934}, {"t": "cible.", "z": 2, "d": 1.982, "r": 0.93, "b": 14, "s": 0.926}, {"t": "Il", "z": 2, "d": 2.053, "r": 1.012, "b": 16, "s": 0.917}, {"t": "explore,", "z": 2, "d": 2.137, "r": 1.082, "b": 14, "s": 0.907}, {"t": "trouve", "z": 2, "d": 2.226, "r": 1.129, "b": 15, "s": 0.897}, {"t": "les", "z": 2, "d": 2.313, "r": 1.212, "b": 13, "s": 0.887}, {"t": "failles,", "z": 2, "d": 2.39, "r": 1.291, "b": 15, "s": 0.878}, {"t": "les", "z": 2, "d": 2.45, "r": 1.357, "b": 18, "s": 0.869}, {"t": "prouve,", "z": 2, "d": 2.488, "r": 1.44, "b": 19, "s": 0.862}, {"t": "et", "z": 2, "d": 2.5, "r": 1.499, "b": 19, "s": 0.856}, {"t": "livre", "z": 2, "d": 2.485, "r": 1.557, "b": 15, "s": 0.852}, {"t": "un", "z": 2, "d": 2.445, "r": 1.647, "b": 15, "s": 0.85}, {"t": "rapport", "z": 2, "d": 2.383, "r": 1.68, "b": 16, "s": 0.85}, {"t": "clair.", "z": 2, "d": 2.304, "r": 1.771, "b": 17, "s": 0.852}, {"t": "En", "z": 3, "d": 2.216, "r": 1.85, "b": 16, "s": 0.856}, {"t": "continu", "z": 3, "d": 2.127, "r": 1.913, "b": 13, "s": 0.861}, {"t": ":", "z": 3, "d": 2.044, "r": 1.957, "b": 18, "s": 0.868}, {"t": "à", "z": 3, "d": 1.975, "r": 2.027, "b": 17, "s": 0.877}, {"t": "chaque", "z": 3, "d": 1.927, "r": 2.095, "b": 19, "s": 0.886}, {"t": "évolution,", "z": 3, "d": 1.902, "r": 2.177, "b": 13, "s": 0.896}, {"t": "pas", "z": 3, "d": 1.905, "r": 2.262, "b": 17, "s": 0.906}, {"t": "une", "z": 3, "d": 1.933, "r": 2.309, "b": 17, "s": 0.916}, {"t": "fois", "z": 3, "d": 1.986, "r": 2.39, "b": 19, "s": 0.925}, {"t": "par", "z": 3, "d": 2.057, "r": 2.432, "b": 13, "s": 0.933}, {"t": "an.", "z": 3, "d": 2.142, "r": 2.544, "b": 19, "s": 0.94}, {"t": "Avec", "z": 4, "d": 2.231, "r": 2.599, "b": 13, "s": 0.945}, {"t": "preuves", "z": 4, "d": 2.318, "r": 2.636, "b": 16, "s": 0.948}, {"t": ":", "z": 4, "d": 2.394, "r": 2.733, "b": 19, "s": 0.95}, {"t": "chaque", "z": 4, "d": 2.453, "r": 2.783, "b": 18, "s": 0.949}, {"t": "faille", "z": 4, "d": 2.489, "r": 2.88, "b": 17, "s": 0.947}, {"t": "est", "z": 4, "d": 2.5, "r": 2.905, "b": 19, "s": 0.943}, {"t": "démontrée,", "z": 4, "d": 2.483, "r": 2.989, "b": 13, "s": 0.937}, {"t": "pas", "z": 4, "d": 2.442, "r": 3.064, "b": 15, "s": 0.929}, {"t": "signalée.", "z": 4, "d": 2.378, "r": 3.146, "b": 14, "s": 0.921}, {"t": "Sous", "z": 5, "d": 2.299, "r": 3.212, "b": 18, "s": 0.911}, {"t": "contrôle", "z": 5, "d": 2.211, "r": 3.262, "b": 19, "s": 0.901}, {"t": ":", "z": 5, "d": 2.122, "r": 3.314, "b": 19, "s": 0.891}, {"t": "vos", "z": 5, "d": 2.04, "r": 3.398, "b": 16, "s": 0.882}, {"t": "données", "z": 5, "d": 1.972, "r": 3.489, "b": 18, "s": 0.873}, {"t": "restent", "z": 5, "d": 1.925, "r": 3.556, "b": 16, "s": 0.865}, {"t": "chez", "z": 5, "d": 1.902, "r": 3.615, "b": 17, "s": 0.859}, {"t": "vous.", "z": 5, "d": 1.906, "r": 3.682, "b": 18, "s": 0.854}];
// Le texte est en plusieurs paragraphes : chaque mot va dans le sien, et
// l'apparition suit l'ordre de lecture, du chapo a la derniere ligne.
const zones = [...document.querySelectorAll('#texte .par')];
MOTS.forEach(w => {
  const e = document.createElement('span');
  e.className = 'm';
  e.textContent = w.t;
  e.style.transitionDuration = w.d + 's';
  e.style.transitionDelay = w.r + 's';
  zones[w.z].appendChild(e);
});
const spans = zones.flatMap(z => [...z.children]);
function repos() {
  spans.forEach((e, i) => {
    e.classList.remove('pose');
    const w = MOTS[i];
    e.style.opacity = 0;
    e.style.filter = 'blur(' + w.b + 'px) brightness(.6)';
    e.style.transform = 'translateY(20px) scale(' + w.s + ') rotateX(-15deg)';
    e.style.textShadow = '0 0 40px rgba(255,255,255,.4), ' + NOIR;
  });
}
function jouerTexte() {
  repos();
  requestAnimationFrame(() => setTimeout(() => {
    spans.forEach(e => {
      e.style.opacity = 1;
      e.style.filter = 'blur(0px) brightness(1)';
      e.style.transform = 'translateY(0) scale(1) rotateX(0deg)';
      e.style.textShadow = '0 2px 8px rgba(255,255,255,.1), ' + NOIR;
    });
  }, 200));
  const fin = Math.max(...MOTS.map(w => w.r + w.d));
  setTimeout(() => spans.forEach(e => {
    e.style.filter = '';
    e.style.transform = '';
    e.classList.add('pose');
  }), (fin + 0.3) * 1000);
  setTimeout(jouerTexte, (fin + 1) * 1000 + 4000);
}
jouerTexte();

// ── Ouverture : rideau noir, flou qui se leve ────────────────────────────
const rideau = document.createElement('div');
rideau.id = 'rideau';
document.body.appendChild(rideau);
// cette slide est sur fond noir : il n'y a pas de decor a faire monter
const decor = document.getElementById('ether');
const fond = document.getElementById('bloim');
const blocs = [...document.querySelectorAll('#scene .inner > *')];
const COURBE = 'cubic-bezier(.22,.61,.36,1)';
let animations = [], derniereOuverture = 0;

function ouvrir() {
  derniereOuverture = performance.now();
  animations.forEach(a => a.cancel());
  animations = [
    rideau.animate([{ opacity: 1 }, { opacity: 0 }],
      { duration: 2200, easing: COURBE, fill: 'backwards' }),
    ...(decor ? [decor.animate([{ opacity: 0 }, { opacity: 1 }],
      { duration: 2600, easing: COURBE, fill: 'backwards' })] : []),
    fond.animate([{ opacity: 0 }, { opacity: 1 }],
      { duration: 2600, easing: COURBE, fill: 'backwards' }),
    ...blocs.map((e, i) => e.animate([
      { opacity: 0, transform: 'translateY(16px)', filter: 'blur(12px)' },
      { opacity: 1, transform: 'none', filter: 'blur(0px)' }],
      { duration: 1600, delay: 380 + i * 160, easing: COURBE,
        fill: 'backwards' }))
  ];
  jouerTexte();
}
ouvrir();

// Rejouer a chaque retour sur la slide : le lecteur ne masque pas les slides
// voisines, il les translate hors du cadre, donc nos rAF sont brides et non
// geles. Le signal fiable est la reprise d'une cadence pleine.
let precedent = performance.now(), reprise = false, rapides = 0;
(function veille() {
  const t = performance.now(), dt = t - precedent;
  precedent = t;
  if (dt > 400) { reprise = true; rapides = 0; }
  else if (reprise) {
    rapides = dt < 40 ? rapides + 1 : 0;
    if (rapides >= 6) {
      reprise = false; rapides = 0;
      if (t - derniereOuverture > 2500) ouvrir();
    }
  }
  requestAnimationFrame(veille);
})();
</script>

</body></html>
