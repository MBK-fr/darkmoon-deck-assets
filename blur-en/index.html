<!doctype html><html lang="en"><head><meta charset="utf-8">
<style>
  /* ── Le pied : les deux logos et le numero de slide ────────────────── */
  .pied{position:absolute;left:72px;right:72px;bottom:22px;display:flex;
        align-items:center;justify-content:space-between;font-size:11px;
        letter-spacing:.16em;text-transform:uppercase;
        color:rgb(255 255 255 / .38);z-index:8}
  .pied .marque{display:flex;align-items:center;gap:12px}
  .pied .lg-dm{height:17px;width:auto;display:block;opacity:.9}
  .pied .lg-asc{height:12px;width:auto;display:block;opacity:.62}
  .pied .tiret{width:1px;height:12px;background:rgb(255 255 255 / .22);
               display:block}
  /* Port du composant @xubohuah/blur-text-animation — ses classes résolues :
       conteneur  flex items-center justify-center min-h-screen bg-black
       bloc       text-center max-w-5xl px-8      → 64rem, 2rem de marge
       paragraphe text-4xl md:text-5xl lg:text-6xl  font-light
                  leading-relaxed  tracking-wide   text-white
                  font-['Avenir_Next','Avenir',system-ui,sans-serif]
       mot        inline-block · margin-right .35em · transition-all
     On se cale sur le palier md (48 px) : au palier lg le texte, plus long que
     celui de la démo, sortirait du cadre 1280×720.                          */
  html,body{margin:0;height:100%;overflow:hidden}
  /* le noir du composant laisse place au fond etheral, pose derriere */
  .wrap{position:relative;z-index:1;display:flex;align-items:center;
        justify-content:center;min-height:100vh;background:transparent}
  
  #ether{position:fixed;inset:0;z-index:0;overflow:hidden;background:#000}
  #ether .fluide{position:absolute;inset:0;width:100%;height:100%;
                 object-fit:cover;object-position:center;
                 pointer-events:none;border:0;display:block}
  #ether .grain{position:absolute;inset:0;
                background-image:url('../ether/noise.png');
                background-size:240px;background-repeat:repeat;opacity:.5}

  .inner{position:relative;text-align:center;max-width:64rem;
         padding-left:2rem;padding-right:2rem}
  /* halo sombre derriere le bloc de texte : les ombres portees suivent le
     contour des lettres, ce voile-la assombrit aussi les blancs entre les
     mots et les lignes */
  .inner::before{content:"";position:absolute;inset:-12% -8%;z-index:-1;
                 background:radial-gradient(52% 46% at 50% 50%,
                   rgba(0,0,0,.74) 0%, rgba(0,0,0,.52) 44%,
                   rgba(0,0,0,.22) 70%, rgba(0,0,0,0) 100%)}
  .txt{color:#fff;font-size:3rem;line-height:1.625;letter-spacing:.025em;
       font-weight:300;margin:0;
       font-family:'Avenir Next','Avenir',system-ui,sans-serif;perspective:900px}
  .m{display:inline-block;margin-right:.35em;
     transition-property:opacity,filter,transform,text-shadow;
     transition-timing-function:cubic-bezier(.6,.04,.22,1);
     will-change:filter,transform,opacity;transform-style:preserve-3d;
     backface-visibility:hidden}
  /* Fin de cycle : plus de `will-change`, plus de 3D, plus de filtre. Un
     `blur(0px)` ou un `will-change` maintient le mot dans un calque
     composite, rasterise a sa taille puis remis a l'echelle par le lecteur :
     c'est ce qui ramollissait le texte. */
  .m.pose{will-change:auto;transform-style:flat;backface-visibility:visible}

  .langue{position:absolute;top:22px;right:72px;z-index:6;display:flex;
          align-items:center;gap:9px;font-size:11px;letter-spacing:.16em;
          text-transform:uppercase;font-weight:500;
          font-family:'Avenir Next','Avenir',system-ui,sans-serif;
          -webkit-user-select:none;user-select:none}
  .langue a{color:rgb(255 255 255 / .38);text-decoration:none;
            padding:3px 5px;border-radius:7px;line-height:1;
            transition:color .22s ease,background-color .22s ease}
  .langue a:hover{color:rgb(255 255 255 / .72);
                  background:rgb(255 255 255 / .05)}
  .langue a.on{color:rgb(255 255 255 / .92)}
  .langue .filet{width:1px;height:10px;background:rgb(255 255 255 / .22)}
</style><script>
(function(){
  var ici = 'en', jumelle = '../blur/';
  try {
    var choisi = localStorage.getItem('darkmoon-deck-langue');
    if (choisi && choisi !== ici) location.replace(jumelle);
  } catch (e) {}
})();
</script></head><body>
<div id="ether">
  <video class="fluide" autoplay muted loop playsinline preload="auto"
         disablepictureinpicture tabindex="-1" aria-hidden="true"
         poster="../ether/silk-pose.jpg">
    <source src="../ether/silk.webm" type="video/webm">
    <source src="../ether/silk.mp4" type="video/mp4">
  </video>
  <div class="grain"></div>
</div>
<div class="wrap"><div class="inner"><p class="txt" id="p"></p></div></div>
<script>
// Le fond etheral est clair par endroits : sans cette ombre les mots blancs
// s'y perdent. Elle s'ajoute a celle du composant, elle ne la remplace pas.
// Cinq couches empilees : une ombre CSS ne depasse pas l'opacite 1, c'est en
// les superposant qu'on obtient un noir vraiment dense autour des lettres.
const NOIR = '0 0 10px rgba(0,0,0,1), 0 0 22px rgba(0,0,0,1), '
           + '0 0 44px rgba(0,0,0,.98)';
const MOTS = [{"t": "One", "p": "normal", "d": 0.937, "r": -0.004, "b": 14, "s": 0.9}, {"t": "audit", "p": "normal", "d": 0.931, "r": 0.036, "b": 12, "s": 0.91}, {"t": "a", "p": "normal", "d": 0.916, "r": 0.065, "b": 13, "s": 0.919}, {"t": "year.", "p": "normal", "d": 0.892, "r": 0.11, "b": 12, "s": 0.928}, {"t": "Attacks", "p": "normal", "d": 0.861, "r": 0.16, "b": 15, "s": 0.936}, {"t": "every", "p": "normal", "d": 0.827, "r": 0.174, "b": 18, "s": 0.942}, {"t": "single", "p": "normal", "d": 0.792, "r": 0.221, "b": 15, "s": 0.947}, {"t": "day.", "p": "normal", "d": 0.76, "r": 0.249, "b": 18, "s": 0.949}, {"t": "A", "p": "normal", "d": 0.732, "r": 0.284, "b": 13, "s": 0.95}, {"t": "snapshot", "p": "normal", "d": 0.713, "r": 0.343, "b": 12, "s": 0.949}, {"t": "of", "p": "normal", "d": 0.703, "r": 0.37, "b": 18, "s": 0.945}, {"t": "one", "p": "normal", "d": 0.703, "r": 0.393, "b": 15, "s": 0.94}, {"t": "moment.", "p": "normal", "d": 0.714, "r": 0.429, "b": 14, "s": 0.934}, {"t": "An", "p": "normal", "d": 0.734, "r": 0.471, "b": 14, "s": 0.926}, {"t": "audit", "p": "normal", "d": 0.761, "r": 0.514, "b": 16, "s": 0.917}, {"t": "freezes", "p": "normal", "d": 0.794, "r": 0.55, "b": 14, "s": 0.907}, {"t": "security", "p": "normal", "d": 0.829, "r": 0.575, "b": 15, "s": 0.897}, {"t": "on", "p": "normal", "d": 0.864, "r": 0.618, "b": 13, "s": 0.887}, {"t": "a", "p": "normal", "d": 0.894, "r": 0.658, "b": 15, "s": 0.878}, {"t": "date.", "p": "normal", "d": 0.917, "r": 0.693, "b": 18, "s": 0.869}, {"t": "The", "p": "normal", "d": 0.932, "r": 0.736, "b": 19, "s": 0.862}, {"t": "target", "p": "normal", "d": 0.937, "r": 0.767, "b": 19, "s": 0.856}, {"t": "is", "p": "normal", "d": 0.931, "r": 0.797, "b": 15, "s": 0.852}, {"t": "the", "p": "normal", "d": 0.915, "r": 0.844, "b": 15, "s": 0.85}, {"t": "subcontractors.", "p": "normal", "d": 0.89, "r": 0.862, "b": 16, "s": 0.85}, {"t": "4×", "p": "normal", "d": 0.86, "r": 0.909, "b": 17, "s": 0.852}, {"t": "more", "p": "normal", "d": 0.825, "r": 0.95, "b": 16, "s": 0.856}, {"t": "victims", "p": "normal", "d": 0.79, "r": 0.983, "b": 13, "s": 0.861}, {"t": "than", "p": "normal", "d": 0.758, "r": 1.006, "b": 18, "s": 0.868}, {"t": "large", "p": "normal", "d": 0.731, "r": 1.044, "b": 17, "s": 0.877}, {"t": "accounts.", "p": "normal", "d": 0.712, "r": 1.079, "b": 19, "s": 0.886}, {"t": "NIS2,", "p": "normal", "d": 0.702, "r": 1.121, "b": 13, "s": 0.896}, {"t": "DORA.", "p": "normal", "d": 0.703, "r": 1.166, "b": 17, "s": 0.906}, {"t": "Testing", "p": "normal", "d": 0.714, "r": 1.191, "b": 17, "s": 0.916}, {"t": "is", "p": "normal", "d": 0.735, "r": 1.233, "b": 19, "s": 0.925}, {"t": "becoming", "p": "normal", "d": 0.763, "r": 1.256, "b": 13, "s": 0.933}, {"t": "mandatory.", "p": "normal", "d": 0.796, "r": 1.313, "b": 19, "s": 0.94}];
const p = document.getElementById('p');
MOTS.forEach(w => {
  const e = document.createElement('span');
  e.className = 'm';
  e.textContent = w.t;
  e.style.transitionDuration = w.d + 's';
  e.style.transitionDelay = w.r + 's';
  p.appendChild(e);
});
const spans = [...p.children];
function repos() {
  spans.forEach((e, i) => {
    e.classList.remove('pose');
    const w = MOTS[i];
    e.style.opacity = 0;
    e.style.filter = 'blur(' + w.b + 'px) brightness(.6)';
    e.style.transform = 'translateY(20px) scale(' + w.s + ') rotateX(-15deg)';
    e.style.textShadow = '0 0 40px rgba(255,255,255,.4), ' + NOIR;
  });
}
function jouer() {
  repos();
  requestAnimationFrame(() => setTimeout(() => {
    spans.forEach(e => {
      e.style.opacity = 1;
      e.style.filter = 'blur(0px) brightness(1)';
      e.style.transform = 'translateY(0) scale(1) rotateX(0deg)';
      e.style.textShadow = '0 2px 8px rgba(255,255,255,.1), ' + NOIR;
    });
  }, 200));
  const fin = Math.max(...MOTS.map(w => w.r + w.d));
  // le mot revient dans le flux normal une fois pose
  setTimeout(() => spans.forEach(e => {
    e.style.filter = '';
    e.style.transform = '';
    e.classList.add('pose');
  }), (fin + 0.3) * 1000);
  setTimeout(jouer, (fin + 1) * 1000 + 4000);      // animationDelay = 4000
}
jouer();
</script><div class="pied"><span class="marque"><img class="lg-dm" src="../logo-horizontal-alice.svg" alt="Darkmoon"><span class="tiret"></span><img class="lg-asc" src="../asc-it-logomark-blanc.svg" alt="ASC-IT"></span><span>01 / 12</span></div>
<div class="langue">
  <a  href="../blur/" data-l="fr">FR</a><span class="filet"></span><a
     class="on" href="../blur-en/" data-l="en">EN</a>
</div>
<script>
document.querySelectorAll('.langue a').forEach(function (a) {
  a.addEventListener('click', function () {
    try { localStorage.setItem('darkmoon-deck-langue', a.dataset.l); } catch (e) {}
  });
});
</script>
</body></html>
