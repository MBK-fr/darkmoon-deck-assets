<!doctype html><html lang="fr"><head><meta charset="utf-8">
<title>Darkmoon, tous les scopes couverts</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;
            font-family:'Avenir Next',Avenir,ui-sans-serif,system-ui,sans-serif;
            -webkit-font-smoothing:antialiased}
  *{box-sizing:border-box}

  /* ── Les quatre keyframes du composant, a l'identique ────────────────── */
  @keyframes orbit-cw{
    from{transform:rotate(var(--start-angle))}
    to{transform:rotate(calc(var(--start-angle) + 360deg))}}
  @keyframes orbit-ccw{
    from{transform:rotate(var(--start-angle))}
    to{transform:rotate(calc(var(--start-angle) - 360deg))}}
  @keyframes counter-cw{
    from{transform:rotate(var(--counter-offset,0deg))}
    to{transform:rotate(calc(var(--counter-offset,0deg) - 360deg))}}
  @keyframes counter-ccw{
    from{transform:rotate(var(--counter-offset,0deg))}
    to{transform:rotate(calc(var(--counter-offset,0deg) + 360deg))}}

  /* ── Le texte : la slide 2, telle quelle ─────────────────────────────
     Meme composant (`@xubohuah/blur-text-animation`), memes classes
     resolues, meme police et memes reglages : Avenir Next en graisse 300,
     interligne 1,625, interlettrage .025em, halo sombre radial derriere le
     bloc, et l'apparition mot a mot depuis le flou. Seule la taille descend
     de 3rem a 2.05rem : le texte de cette slide est plus long, et la moitie
     basse revient a la planete. */
  /* Le cadre laisse passer la souris, le bloc de texte non : sans ca le
     texte n'etait pas selectionnable. */
  #scene{position:absolute;inset:0;z-index:3;display:flex;
         justify-content:center;align-items:flex-start;padding-top:44px;
         pointer-events:none}
  #scene .inner{pointer-events:auto}
  .inner{position:relative;text-align:center;width:66rem;max-width:66rem;
         padding-left:2rem;padding-right:2rem}
  .inner::before{content:"";position:absolute;inset:-16% -8%;z-index:-1;
                 background:radial-gradient(52% 46% at 50% 50%,
                   rgba(0,0,0,.74) 0%, rgba(0,0,0,.52) 44%,
                   rgba(0,0,0,.22) 70%, rgba(0,0,0,0) 100%)}
  .txt{color:#fff;font-size:1.92rem;line-height:1.625;letter-spacing:.025em;
       font-weight:300;margin:0;
       font-family:'Avenir Next','Avenir',system-ui,sans-serif;
       perspective:900px}
  .m{display:inline-block;margin-right:.35em;
     transition-property:opacity,filter,transform,text-shadow;
     transition-timing-function:cubic-bezier(.25,.46,.45,.94);
     will-change:filter,transform,opacity;transform-style:preserve-3d;
     backface-visibility:hidden}
  .m.pose{will-change:auto;transform-style:flat;backface-visibility:visible}
  .pied{position:absolute;left:76px;right:76px;bottom:26px;display:flex;
        justify-content:space-between;font-size:11px;letter-spacing:.16em;
        text-transform:uppercase;color:rgb(255 255 255 / .38);z-index:4}

  /* ── Le bloc du composant ────────────────────────────────────────────
     Le composant ancre ses anneaux au bas de son cadre : seule la moitie
     haute se voit, comme un horizon. On garde ce parti pris, agrandi pour
     que la planete tienne la slide. */
  /* Aucune mise a l'echelle : les anneaux gardent les tailles du composant,
     720, 880 et 1060 px, et les pastilles leur diametre naturel. Mettre le
     bloc entier a l'echelle grossissait tout ensemble et deformait la
     lecture ; ici il n'est que POSITIONNE. */
  #orbites{position:absolute;left:50%;bottom:-92px;width:1120px;
           height:640px;z-index:2;transform:translateX(-50%);
           pointer-events:none}
  /* Habillage d'origine du composant : `border border-border` pour
     l'anneau, `p-4 border border-border rounded-full bg-background` pour la
     pastille, icone en 32 px sans filtre. Le neon est retire. */
  .anneau{position:absolute;bottom:0;left:50%;
          transform:translate(-50%,50%);border-radius:9999px;
          border:1px solid rgb(255 255 255 / .12)}
  .bras{position:absolute;top:0;left:50%;height:50%;margin-left:-24px;
        transform-origin:bottom center;display:flex;flex-direction:column;
        align-items:center;justify-content:flex-start}
  /* Le composant a deux paliers, `p-3` avec `w-6` et, au-dessus de 768 px,
     `p-4` avec `w-8`. A la taille de la slide c'est le premier qui va :
     l'icone en 32 px ecrasait la pastille. */
  /* Le disque n'est plus un aplat noir : il porte le degrade des cartes,
     du bleu nuit vers le noir, avec une lueur basse pour le detacher du
     decor. Aucun filet, mais du contraste. */
  .pastille{margin-top:-30px;padding:12px;border-radius:9999px;
            background:radial-gradient(120% 120% at 30% 22%,
              #1c2a4d 0%, #101a33 42%, #060a14 100%);
            box-shadow:0 0 0 1px rgb(120 150 220 / .22),
                       0 4px 14px rgb(0 0 0 / .9),
                       inset 0 1px 0 rgb(190 215 255 / .14);
            position:relative;z-index:10;display:flex}
  .pastille img{width:24px;height:24px;display:block}
  #sphere{position:absolute;bottom:0;left:50%;
          transform:translate(-50%,50%);width:640px;aspect-ratio:1;
          z-index:9;pointer-events:none}
  #sphere canvas{width:100%;height:auto;border-radius:9999px;display:block}
  /* ── L'ouverture : rideau noir, flou qui se leve ─────────────────────── */
  #rideau{position:fixed;inset:0;z-index:20;background:#000;
          pointer-events:none;opacity:0}
  #voile{position:absolute;inset:0;z-index:0;
         background:linear-gradient(100deg,rgb(0 0 0 / .92) 0%,
           rgb(0 0 0 / .78) 34%,rgb(0 0 0 / .45) 60%,rgb(0 0 0 / .3) 100%)}

  #ether{position:fixed;inset:0;z-index:0;overflow:hidden;background:#000}
  #ether .fluide{position:absolute;inset:-100px;
                 filter:url(#ether-filtre) blur(4px)}
  /* Le composant pose un gris neutre 128. On garde exactement sa clarte mais
     on le teinte avec les couleurs relevees dans l'animation des cartes :
     echantillonnage des cinq fonds, teintes dominantes a 187 et 195 degres
     (turquoise), 210 a 225 (indigo), et un accent chaud vers 0.
     Le degrade remplace l'aplat, le masque et le filtre ne changent pas. */
  #ether .teinte{width:100%;height:100%;background-color:rgba(128,128,128,1);
                 background-image:linear-gradient(135deg,
                   #3d8a93 0%, #3f6f9b 32%, #4a5893 58%, #6d4a58 82%,
                   #8a4a44 100%);
                 -webkit-mask-image:url('../ether/mask.png');
                 mask-image:url('../ether/mask.png');
                 -webkit-mask-size:cover;mask-size:cover;
                 -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
                 -webkit-mask-position:center;mask-position:center}
  #ether .grain{position:absolute;inset:0;
                background-image:url('../ether/noise.png');
                background-size:240px;background-repeat:repeat;opacity:.5}
</style></head><body>
<div id="ether">
  <div class="fluide">
    <svg style="position:absolute" aria-hidden="true"><defs>
      <filter id="ether-filtre">
        <feTurbulence result="undulation" numOctaves="2"
                      baseFrequency="0.0005,0.002" seed="0" type="turbulence"/>
        <feColorMatrix in="undulation" type="hueRotate" values="180">
          <animate attributeName="values" from="0" to="360" dur="5.84s"
                   repeatCount="indefinite"/>
        </feColorMatrix>
        <feColorMatrix in="dist" result="circulation" type="matrix"
          values="4 0 0 0 1  4 0 0 0 1  4 0 0 0 1  1 0 0 0 0"/>
        <feDisplacementMap in="SourceGraphic" in2="circulation" scale="100"
                           result="dist"/>
        <feDisplacementMap in="dist" in2="undulation" scale="100"
                           result="output"/>
      </filter>
    </defs></svg>
    <div class="teinte"></div>
  </div>
  <div class="grain"></div>
</div>
<div id="voile"></div>

// ── La sphere de particules, reprise du composant ────────────────────────
// 9000 points, rayon 275, la meme palette, la meme rotation de 0,003 radian
// par image, le meme tri par profondeur et les memes formules d'opacite et
// de taille. Seul le tirage aleatoire differe d'une visite a l'autre, comme
// chez lui.
const NB = 9000, RAYON = 275;
const TEINTES = ["#ea580c","#d97706","#84cc16","#f1f5f9","#94a3b8",
                 "#2563eb","#3b82f6","#60a5fa","#f97316"];
function points(n){
  const out = [];
  for (let i = 0; i < n; i++){
    const u = Math.random() * 2 - 1, t = Math.random() * 2 * Math.PI;
    const s = Math.sqrt(1 - u * u), r = RAYON * (.97 + Math.random() * .06);
    const x = r * s * Math.cos(t), y = r * s * Math.sin(t), z = r * u;
    const f = (y + RAYON) / (2 * RAYON);
    let k;
    if (Math.random() > .9) k = 7;
    else if (f > .6) k = Math.floor(Math.random() * 3);
    else if (f < .4) k = 3 + Math.floor(Math.random() * 3);
    else k = Math.floor(Math.random() * TEINTES.length);
    out.push({x, y, z, c: TEINTES[k]});
  }
  return out;
}
(() => {
  const toile = document.querySelector('#sphere canvas');
  const ctx = toile.getContext('2d', {alpha: true});
  const P = points(NB), COTE = 575;
  toile.width = COTE; toile.height = COTE;
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  let angle = 0;
  const image = () => {
    ctx.clearRect(0, 0, COTE, COTE);
    angle += .003;
    ctx.save(); ctx.translate(COTE / 2, COTE / 2);
    const co = Math.cos(angle), si = Math.sin(angle);
    const vus = P.map(p => {
      const x = p.x * co - p.z * si, z = p.x * si + p.z * co;
      const prof = (z + RAYON) / (2 * RAYON);
      const d = Math.min(Math.hypot(x, p.y) / RAYON, 1);
      return {x, y: p.y, z, c: p.c,
              o: Math.max(.1, Math.pow(d, 3) * .8) * (.4 + .6 * prof),
              t: (.4 + .8 * prof) * 1.5};
    });
    vus.sort((a, b) => a.z - b.z);
    for (const v of vus){
      ctx.beginPath(); ctx.arc(v.x, v.y, v.t, 0, Math.PI * 2);
      ctx.fillStyle = v.c; ctx.globalAlpha = v.o; ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.restore();
    requestAnimationFrame(image);
  };
  image();
})();

const bloc = document.getElementById('orbites');
const texte = [...document.querySelectorAll('#scene > * > *, #scene > *')]
  .filter(e => e.id !== 'scene');
const COURBE = 'cubic-bezier(.22,.61,.36,1)';
let animations = [], derniereOuverture = 0;

function ouvrir() {
  derniereOuverture = performance.now();
  animations.forEach(a => a.cancel());
  animations = [
    rideau.animate([{ opacity: 1 }, { opacity: 0 }],
      { duration: 2200, easing: COURBE, fill: 'backwards' }),
    decor.animate([{ opacity: 0 }, { opacity: 1 }],
      { duration: 2600, easing: COURBE, fill: 'backwards' }),
    bloc.animate([
      { opacity: 0, filter: 'blur(26px)',
        transform: 'translateX(-50%) scale(.92)' },
      { opacity: 1, filter: 'blur(0px)',
        transform: 'translateX(-50%) scale(1)' }],
      { duration: 2300, delay: 260, easing: COURBE, fill: 'backwards' }),
    ...texte.map((e, i) => e.animate([
      { opacity: 0, transform: 'translateY(18px)', filter: 'blur(14px)' },
      { opacity: 1, transform: 'none', filter: 'blur(0px)' }],
      { duration: 1700, delay: 420 + i * 170, easing: COURBE,
        fill: 'backwards' }))
  ];
}
ouvrir();

// Rejouer a chaque retour sur la slide. Le lecteur ne masque pas les slides
// voisines, il les translate hors du cadre : nos rAF sont BRIDES, pas geles,
// donc un simple trou entre deux images arrive aussi quand on est ailleurs.
// Le signal fiable est la REPRISE d'une cadence pleine, six images d'affilee
// sous 40 ms apres un trou.
let precedent = performance.now(), reprise = false, rapides = 0;
(function veille() {
  const t = performance.now(), dt = t - precedent;
  precedent = t;
  if (dt > 400) { reprise = true; rapides = 0; }
  else if (reprise) {
    rapides = dt < 40 ? rapides + 1 : 0;
    if (rapides >= 6) {
      reprise = false; rapides = 0;
      if (t - derniereOuverture > 2500) ouvrir();
    }
  }
  requestAnimationFrame(veille);
})();
</script>
